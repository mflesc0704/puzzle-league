<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle League</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
    --ring: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --axis: #383835;
      --ring: rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --ring: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px; max-width: 760px; margin: 0 auto;
  }
  h1 { font-size: 1.35rem; }
  .sub { color: var(--muted); font-size: .8rem; margin-bottom: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--ring);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
  }
  h2 { font-size: .95rem; color: var(--ink-2); margin-bottom: 10px; }
  .stand-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .stand-rank { width: 1.4em; color: var(--muted); font-size: .9rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .stand-name { flex: none; width: 7em; font-weight: 600; font-size: .95rem; }
  .wchip { font-size: .7rem; color: var(--ink-2); }
  .bar-wrap { flex: 1; height: 14px; }
  .bar { height: 14px; border-radius: 4px; min-width: 2px; }
  .bar-devil {
    /* molten lava flowing through the bar, flame-tongue tip, breathing glow */
    background: linear-gradient(90deg, #4a0000, #8b0000, #e34948, #ff9a3d,
                                #ffd24a, #e34948, #8b0000, #4a0000) !important;
    background-size: 300% 100% !important;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 22%, calc(100% - 5px) 42%,
                       100% 58%, calc(100% - 6px) 78%, 100% 100%, 0 100%);
    animation: lavaflow 2.6s linear infinite,
               devilglow 1.4s ease-in-out infinite alternate;
  }
  @keyframes lavaflow {
    from { background-position: 0% 0; }
    to   { background-position: 300% 0; }
  }
  @keyframes devilglow {
    from { filter: drop-shadow(0 0 2px rgba(227, 73, 72, .5)); }
    to   { filter: drop-shadow(0 0 9px rgba(255, 110, 40, .9)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar-devil { animation: none; }
  }
  .stand-pts { flex: none; width: 2.5em; text-align: right;
               font-variant-numeric: tabular-nums; font-weight: 600; }
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .games { grid-template-columns: 1fr; } }
  .game { background: var(--surface); border: 1px solid var(--ring);
          border-radius: 12px; padding: 10px 12px; }
  .game h3 { font-size: .85rem; margin-bottom: 6px; }
  .game .nodata { color: var(--muted); font-size: .8rem; }
  .grow { display: flex; align-items: center; gap: 8px; font-size: .85rem;
          padding: 2px 0; }
  .grow .nm { flex: 1; }
  .grow .sc { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .grow .pt { width: 2.6em; text-align: right; color: var(--ink-2);
              font-variant-numeric: tabular-nums; }
  .grow.dnp { color: var(--muted); }
  .medal { width: 1.2em; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem;
            color: var(--ink-2); margin: 4px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
  #chartwrap { position: relative; }
  #tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--ring);
    border-radius: 8px; padding: 6px 9px; font-size: .75rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; z-index: 2;
  }
  details summary { cursor: pointer; color: var(--ink-2); font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px;
          font-size: .85rem; }
  th, td { text-align: right; padding: 5px 8px;
           border-bottom: 1px solid var(--grid);
           font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: .68rem;
       text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: none; }
  .tiles { display: grid; gap: 10px;
           grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile { border: 1px solid var(--ring); border-radius: 10px;
          padding: 10px 12px; }
  .tile .em { font-size: 1.25rem; line-height: 1; }
  .tile .lb { font-size: .66rem; letter-spacing: .07em; text-transform: uppercase;
              color: var(--muted); margin-top: 6px; }
  .tile .vl { font-size: .84rem; font-weight: 600; margin-top: 2px;
              line-height: 1.35; }
  .rec-line { color: var(--muted); font-size: .72rem; margin: -2px 0 4px; }
  .tagline { margin: -4px 0 4px 2.6em; color: var(--muted); font-size: .75rem;
             font-style: italic; }
  .alert-card { border: 2px solid #e34948; text-align: center;
                animation: alertpulse 1.2s ease-in-out infinite alternate; }
  .alert-head { font-size: .68rem; letter-spacing: .3em; text-transform: uppercase;
                color: #e34948; font-weight: 700; }
  .alert-head .siren { display: inline-block;
                       animation: sirenspin 0.7s ease-in-out infinite alternate; }
  .alert-big { font-size: 1.7rem; font-weight: 800; letter-spacing: .04em;
               margin: 6px 0 2px; }
  .alert-sub { color: var(--ink-2); font-size: .85rem; }
  @keyframes alertpulse {
    from { box-shadow: 0 0 0 rgba(227, 73, 72, 0); }
    to   { box-shadow: 0 0 16px rgba(227, 73, 72, .55); }
  }
  @keyframes sirenspin {
    from { transform: rotate(-14deg); }
    to   { transform: rotate(14deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .alert-card, .alert-head .siren { animation: none; }
  }
  .game table { font-size: .8rem; }
  .game th, .game td { padding: 4px 6px; }
  .game th:first-child, .game td:first-child { white-space: nowrap; }
</style>
</head>

function isDark() {
  var t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function colors() { return isDark() ? DATA.colorsDark : DATA.colorsLight; }
function playerById(id) {
  for (var i = 0; i < DATA.players.length; i++)
    if (DATA.players[i].id === id) return DATA.players[i];
  return null;
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    var p = order[i], pts = cur.totals[p.id] || 0;
    var w = Math.round(100 * pts / max);
    var won = (DATA.weeksWon || {})[p.id] || 0;
    html += '<div class="stand-row">'
      + '<span class="stand-rank">' + (i + 1) + '</span>'
      + '<span class="dot" style="background:' + c[p.slot] + '"></span>'
      + '<span class="stand-name">' + esc(p.first)
      + ' <span class="wchip">🏆' + won + '</span></span>'
      + '<span class="bar-wrap"><span class="bar' + (p.special ? ' bar-devil' : '')
      + '" style="width:' + w + '%;background:' + c[p.slot]
      + ';display:block"></span></span>'
      + '<span class="stand-pts">' + pts + '</span></div>';
  }
  box.innerHTML = html;
}

function renderWeekHistory() {
  var weeks = DATA.weeks || [];
  var html = '<table><tr><th>Week</th>';
  DATA.players.forEach(function (p) { html += '<th>' + esc(p.first) + '</th>'; });
  html += '</tr>';
  weeks.forEach(function (w, i) {
    html += '<tr><td>Wk ' + (i + 1) + ' · ' + esc(w.label)
      + (w.complete ? '' : ' · live')
      + ((w.missed || []).length ? ' · ⚠️' + w.missed.length : '') + '</td>';
    DATA.players.forEach(function (p) {
      var isWin = w.complete && w.winners.indexOf(p.id) >= 0;
      html += '<td' + (isWin ? ' style="font-weight:700"' : '') + '>'
        + (w.totals[p.id] || 0) + (isWin ? ' 🏆' : '') + '</td>';
    });
    html += '</tr>';
  });
  html += '</table>';
  document.getElementById('weekhistory').innerHTML = html;
}

function renderToday() {
  var d = DATA.day;
  document.getElementById('todayhdr').textContent =
    'Today · ' + d + ' · ' + DATA.players.map(function (p) {
      return p.first + ' ' + (DATA.todayTotals[p.id] || 0);
    }).join(', ');
  var medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  var html = '', c = colors();
  for (var g = 0; g < DATA.todayGames.length; g++) {
    var game = DATA.todayGames[g];
    html += '<div class="game"><h3>' + esc(game.name) + '</h3>';
    if (game.status !== 'ok' || !game.rows.length) {
      html += '<div class="nodata">no data yet</div>';
    } else {
      for (var r = 0; r < game.rows.length; r++) {
        var row = game.rows[r], p = playerById(row.player);
        if (row.played) {
          html += '<div class="grow">'
            + '<span class="medal">' + (medals[row.rank] || row.rank + 'th') + '</span>'
            + '<span class="dot" style="background:' + c[p.slot] + '"></span>'
            + '<span class="nm">' + esc(p.first) + '</span>'
            + '<span class="sc">' + esc(row.score) + '</span>'
            + '<span class="pt">+' + row.points + '</span></div>';
        } else {
          html += '<div class="grow dnp"><span class="medal">—</span>'
            + '<span class="dot" style="background:' + c[p.slot] + ';opacity:.35"></span>'
            + '<span class="nm">' + esc(p.first) + '</span>'
            + '<span class="sc">did not play</span>'
            + '<span class="pt">+0</span></div>';
        }
      }
    }
    html += '</div>';
  }
  document.getElementById('games').innerHTML = html;
}

function renderLegend() {
  var c = colors(), html = '';
  for (var i = 0; i < DATA.players.length; i++) {
    var p = DATA.players[i];
    html += '<span><span class="dot" style="background:' + c[p.slot]
      + '"></span>' + esc(p.first) + '</span>';
  }
  document.getElementById('legend').innerHTML = html;
}

var chartGeom = null;
function renderChart() {
  var svg = document.getElementById('chart');
  var days = DATA.series.days, c = colors();
  var W = svg.clientWidth || 700, H = 240;
  var padL = 34, padR = 92, padT = 12, padB = 24;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  if (!days.length) {
    svg.innerHTML = '<text x="' + (W / 2) + '" y="' + (H / 2)
      + '" text-anchor="middle" fill="var(--muted)">No days recorded yet</text>';
    return;
  }
  var maxY = 5;
  DATA.players.forEach(function (p) {
    var arr = DATA.series.cumulative[p.id];
    if (arr.length) maxY = Math.max(maxY, arr[arr.length - 1]);
  });
  var x = function (i) {
    return days.length === 1 ? (padL + (W - padL - padR) / 2)
      : padL + (W - padL - padR) * i / (days.length - 1);
  };
  var y = function (v) { return padT + (H - padT - padB) * (1 - v / maxY); };

  var parts = [];
  var ticks = 4;
  for (var t = 0; t <= ticks; t++) {
    var val = Math.round(maxY * t / ticks), yy = y(val);
    parts.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy
      + '" y2="' + yy + '" stroke="var(--grid)" stroke-width="1"/>');
    parts.push('<text x="' + (padL - 6) + '" y="' + (yy + 4)
      + '" text-anchor="end" fill="var(--muted)">' + val + '</text>');
  }
  parts.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(0)
    + '" y2="' + y(0) + '" stroke="var(--axis)" stroke-width="1"/>');
  var lblEvery = Math.max(1, Math.ceil(days.length / 6));
  for (var i = 0; i < days.length; i += lblEvery) {
    parts.push('<text x="' + x(i) + '" y="' + (H - 6)
      + '" text-anchor="middle" fill="var(--muted)">'
      + days[i].slice(5).replace('-', '/') + '</text>');
  }
  // series lines, direct-labeled at the line end (color never carries alone)
  var ends = [];
  DATA.players.forEach(function (p) {
    var arr = DATA.series.cumulative[p.id], dpath = '';
    for (var i = 0; i < arr.length; i++)
      dpath += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(arr[i]).toFixed(1);
    parts.push('<path d="' + dpath + '" fill="none" stroke="' + c[p.slot]
      + '" stroke-width="' + (p.special ? 3 : 2) + '" stroke-linejoin="round"/>');
    if (days.length === 1)
      parts.push('<circle cx="' + x(0) + '" cy="' + y(arr[0]) + '" r="4" fill="'
        + c[p.slot] + '"/>');
    ends.push({ p: p, y: y(arr[arr.length - 1]), v: arr[arr.length - 1] });
  });
  ends.sort(function (a, b) { return a.y - b.y; });
  for (var e = 0; e < ends.length; e++) {           // nudge collided labels apart
    if (e > 0 && ends[e].y - ends[e - 1].y < 13) ends[e].y = ends[e - 1].y + 13;
  }
  ends.forEach(function (en) {
    // identity comes from the name + a colored tick; the text itself stays ink
    parts.push('<line x1="' + (W - padR + 4) + '" x2="' + (W - padR + 12)
      + '" y1="' + en.y + '" y2="' + en.y + '" stroke="' + c[en.p.slot]
      + '" stroke-width="3"/>');
    parts.push('<text x="' + (W - padR + 16) + '" y="' + (en.y + 4)
      + '" fill="var(--ink-2)" font-weight="600">' + esc(en.p.first) + ' '
      + en.v + '</text>');
  });
  parts.push('<line id="xhair" y1="' + padT + '" y2="' + y(0)
    + '" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>');
  svg.innerHTML = parts.join('');
  chartGeom = { x: x, y: y, W: W, padL: padL, padR: padR };
}

function hookHover() {
  var svg = document.getElementById('chart'), tip = document.getElementById('tip');
  var wrap = document.getElementById('chartwrap');
  function move(ev) {
    if (!chartGeom || !DATA.series.days.length) return;
    var rect = svg.getBoundingClientRect();
    var px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    var days = DATA.series.days, best = 0, bd = 1e9;
    for (var i = 0; i < days.length; i++) {
      var d = Math.abs(chartGeom.x(i) * rect.width / chartGeom.W - px);
      if (d < bd) { bd = d; best = i; }
    }
    var xh = document.getElementById('xhair');
    xh.setAttribute('x1', chartGeom.x(best));
    xh.setAttribute('x2', chartGeom.x(best));
    xh.setAttribute('visibility', 'visible');
    var lines = ['<b>' + days[best] + '</b>'];
    var ordered = DATA.players.slice().sort(function (a, b) {
      return DATA.series.cumulative[b.id][best] - DATA.series.cumulative[a.id][best];
    });
    ordered.forEach(function (p) {
      var day = days[best];
      var dayPts = (DATA.dayTotals[day] || {})[p.id] || 0;
      lines.push(esc(p.first) + ': ' + DATA.series.cumulative[p.id][best]
        + ' (+' + dayPts + ')');
    });
    tip.innerHTML = lines.join('<br>');
    tip.style.display = 'block';
    var wr = wrap.getBoundingClientRect();
    var tx = px + 14;
    if (tx + tip.offsetWidth > wr.width) tx = px - tip.offsetWidth - 14;
    tip.style.left = Math.max(0, tx) + 'px';
    tip.style.top = '10px';
  }
  function leave() {
    tip.style.display = 'none';
    var xh = document.getElementById('xhair');
    if (xh) xh.setAttribute('visibility', 'hidden');
  }
  svg.addEventListener('mousemove', move);
  svg.addEventListener('touchstart', move);
  svg.addEventListener('touchmove', move);
  svg.addEventListener('mouseleave', leave);
  svg.addEventListener('touchend', leave);
}

function renderFun() {
  var card = document.getElementById('funcard');
  if (!DATA.funStats || !DATA.funStats.length) { card.style.display = 'none'; return; }
  card.style.display = '';
  var html = '<div class="tiles">';
  for (var i = 0; i < DATA.funStats.length; i++) {
    var s = DATA.funStats[i];
    html += '<div class="tile"><div class="em">' + s.emoji + '</div>'
      + '<div class="lb">' + esc(s.label) + '</div>'
      + '<div class="vl">' + esc(s.value) + '</div></div>';
  }
  document.getElementById('fun').innerHTML = html + '</div>';
}

function renderGameStats() {
  var c = colors(), html = '';
  for (var g = 0; g < DATA.gameStats.length; g++) {
    var game = DATA.gameStats[g];
    // best-performing first: avg place, then wins, then fastest best time
    var rows = game.players.slice().sort(function (a, b) {
      if ((a.plays > 0) !== (b.plays > 0)) return a.plays > 0 ? -1 : 1;
      var ar = a.avgRank === null ? 99 : a.avgRank;
      var br = b.avgRank === null ? 99 : b.avgRank;
      if (ar !== br) return ar - br;
      if (a.wins !== b.wins) return b.wins - a.wins;
      return (a.bestSecs || 1e9) - (b.bestSecs || 1e9);
    });
    var recSecs = null, recHolders = [];
    rows.forEach(function (r) {
      if (r.bestSecs === null || !r.plays) return;
      if (recSecs === null || r.bestSecs < recSecs) {
        recSecs = r.bestSecs; recHolders = [r];
      } else if (r.bestSecs === recSecs) recHolders.push(r);
    });
    html += '<div class="game"><h3>' + esc(game.name) + '</h3>';
    if (recHolders.length) {
      html += '<div class="rec-line">🏅 record ' + esc(recHolders[0].bestTime)
        + ' — ' + recHolders.map(function (r) {
            return esc(playerById(r.id).first);
          }).join(', ') + '</div>';
    }
    html += '<table><tr><th></th><th>Avg</th><th>Place</th><th>Wins</th><th>Best</th></tr>';
    var leadId = rows.length && rows[0].plays > 0 ? rows[0].id : null;
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r], p = playerById(row.id);
      var played = row.plays > 0;
      var isRec = recSecs !== null && row.bestSecs === recSecs && played;
      html += '<tr' + (played ? '' : ' style="opacity:.45"') + '>'
        + '<td' + (row.id === leadId ? ' style="font-weight:600"' : '') + '>'
        + '<span class="dot" style="background:' + c[p.slot]
        + ';display:inline-block;vertical-align:middle;margin-right:5px"></span>'
        + esc(p.first) + (row.id === leadId ? ' 👑' : '') + '</td>'
        + '<td>' + (played ? esc(row.avgTime) : '—') + '</td>'
        + '<td>' + (played && row.avgRank !== null ? row.avgRank : '—') + '</td>'
        + '<td>' + (played ? row.wins : '—') + '</td>'
        + '<td' + (isRec ? ' style="font-weight:700"' : '') + '>'
        + (played ? esc(row.bestTime) : '—') + '</td></tr>';
    }
    html += '</table></div>';
  }
  document.getElementById('gamestats').innerHTML = html;
}

function renderHistory() {
  var missed = {};
  (DATA.missedDays || []).forEach(function (d) { missed[d] = true; });
  var days = Object.keys(DATA.dayTotals).concat(DATA.missedDays || []);
  days = days.filter(function (d, i) { return days.indexOf(d) === i; })
    .sort().reverse();
  var html = '<table><tr><th>Day</th>';
  DATA.players.forEach(function (p) { html += '<th>' + esc(p.first) + '</th>'; });
  html += '</tr>';
  days.forEach(function (d) {
    if (missed[d]) {
      html += '<tr><td style="color:var(--muted)">' + d + '</td>'
        + '<td colspan="' + DATA.players.length + '" style="color:var(--muted);'
        + 'font-style:italic;text-align:left">no data — day missed</td></tr>';
      return;
    }
    html += '<tr><td>' + d + '</td>';
    DATA.players.forEach(function (p) {
      html += '<td>' + (DATA.dayTotals[d][p.id] || 0) + '</td>';
    });
    html += '</tr>';
  });
  html += '</table>';
  document.getElementById('history').innerHTML = html;
}

function renderAll() {
  renderAlert(); renderStandings(); renderWeek(); renderToday();
  renderLegend(); renderChart();
  renderFun(); renderGameStats(); renderWeekHistory(); renderHistory();
}
renderAll();
hookHover();
window.addEventListener('resize', renderChart);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
</script>
</body>
</html>
