<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Cpath d='M20 14h24v10c0 9-5 15-12 17-7-2-12-8-12-17z' fill='%23ffd166'/%3E%3Crect x='26' y='44' width='12' height='5' rx='2' fill='%23ffd166'/%3E%3Crect x='20' y='49' width='24' height='5' rx='2.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ---------- tokens ---------------------------------------------------------- */
:root {
  color-scheme: light;
  --bg: #f1f2fa; --solid: #ffffff; --surface: rgba(255,255,255,.78);
  --ink: #13151f; --ink2: #454a5f; --muted: #62677f;
  --line: rgba(26,32,70,.09); --line2: rgba(26,32,70,.18);
  --track: rgba(26,32,70,.07); --bar: rgba(243,244,252,.76);
  --shadow: 0 22px 44px -26px rgba(38,48,120,.45), 0 2px 8px rgba(38,48,120,.07);
  --gold: #f0ad1b; --silver: #a9b2c6; --bronze: #c8844d; --slate: #66709a;
  --good: #13a678; --bad: #e5484d;
  --blob: .30;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable Display",
          "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 26px; --r2: 18px; --r3: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0b13; --solid: #171a29; --surface: rgba(26,29,46,.70);
    --ink: #f1f2f9; --ink2: #b6bad0; --muted: #8d92aa;
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.17);
    --track: rgba(255,255,255,.08); --bar: rgba(10,11,19,.72);
    --shadow: 0 22px 44px -24px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.3);
    --blob: .26;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0b13; --solid: #171a29; --surface: rgba(26,29,46,.70);
  --ink: #f1f2f9; --ink2: #b6bad0; --muted: #8d92aa;
  --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.17);
  --track: rgba(255,255,255,.08); --bar: rgba(10,11,19,.72);
  --shadow: 0 22px 44px -24px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.3);
  --blob: .26;
}

/* ---------- base ------------------------------------------------------------ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
b, strong { font-weight: 700; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 4px 16px 90px; }

/* animated colour mesh behind everything, tinted by the players' colours */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
.bg i {
  position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%;
  filter: blur(80px); opacity: var(--blob); will-change: transform;
  animation: drift 26s ease-in-out infinite alternate;
}
.bg i:nth-child(1) { background: var(--p0); left: -22vmax; top: -26vmax; }
.bg i:nth-child(2) { background: var(--p1); right: -26vmax; top: -10vmax; animation-delay: -6s; animation-duration: 31s; }
.bg i:nth-child(3) { background: var(--p2); left: -10vmax; bottom: -34vmax; animation-delay: -12s; animation-duration: 34s; }
.bg i:nth-child(4) { background: var(--p3); right: -20vmax; bottom: -28vmax; animation-delay: -3s; animation-duration: 29s; }
@keyframes drift {
  from { transform: translate3d(0,0,0) scale(1); }
  to   { transform: translate3d(6vmax,4vmax,0) scale(1.12); }
}

/* ---------- top bar + nav --------------------------------------------------- */
.top {
  position: sticky; top: 0; z-index: 60;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(1.5) blur(18px); backdrop-filter: saturate(1.5) blur(18px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px 6px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.02em; font-size: 1.08rem; }
.logo {
  width: 30px; height: 30px; border-radius: 10px; flex: none; position: relative;
  background: linear-gradient(135deg, var(--p0), var(--p1) 55%, var(--p3));
  box-shadow: 0 6px 14px -6px var(--p1);
}
.logo::after {
  content: ""; position: absolute; inset: 7px 8px 8px; border-radius: 3px 3px 9px 9px;
  background: rgba(255,255,255,.92);
  clip-path: polygon(0 0,100% 0,88% 55%,62% 80%,62% 100%,38% 100%,38% 80%,12% 55%);
}
.pill {
  margin-left: auto; font-size: .76rem; font-weight: 700; color: var(--ink2);
  padding: 5px 11px; border-radius: 999px; background: var(--track); white-space: nowrap;
}
.iconbtn {
  width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none;
  transition: transform .2s, background .2s;
}
.iconbtn:hover { transform: rotate(-12deg) scale(1.06); }
.iconbtn svg { width: 18px; height: 18px; }
.nav {
  max-width: 1120px; margin: 0 auto; padding: 2px 16px 10px; display: flex; gap: 6px;
  overflow-x: auto; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  flex: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: .86rem;
  color: var(--ink2); transition: background .25s, color .25s, transform .25s;
}
.nav a:hover { background: var(--track); }
.nav a.on { background: var(--ink); color: var(--bg); }

/* ---------- layout primitives ----------------------------------------------- */
.sec { scroll-margin-top: 112px; margin-top: 26px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 12px; flex-wrap: wrap; }
.sec-h h2 { margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: -.03em; }
.sec-h .sub { color: var(--ink2); font-size: .82rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--surface); }
.eyebrow { font-size: .7rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
.card {
  position: relative; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 18px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.grid2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) {
  .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .card { padding: 24px; }
}
.note { color: var(--muted); font-size: .76rem; line-height: 1.5; margin: 12px 2px 0; }
.empty { color: var(--muted); text-align: center; padding: 22px 8px; font-weight: 600; }
.grad {
  background: linear-gradient(120deg, var(--p0), var(--p1), var(--p3)); -webkit-background-clip: text;
  background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}

/* scroll-reveal */
.rv { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.rv.in { opacity: 1; transform: none; }

/* spotlight: tapping a player dims everyone else */
[data-p] { transition: opacity .3s, filter .3s; }
[data-p].dim { opacity: .28; filter: saturate(.4); }
[data-fb] { cursor: pointer; }

/* ---------- avatars, chips --------------------------------------------------- */
.av {
  width: var(--s, 34px); height: var(--s, 34px); border-radius: 50%; flex: none;
  display: inline-grid; place-items: center; font-weight: 800; letter-spacing: -.02em;
  font-size: calc(var(--s, 34px) * .44); color: var(--pc-ink); background: var(--pc-av, var(--pc));
  box-shadow: inset 0 -7px 12px rgba(0,0,0,.13), inset 0 2px 3px rgba(255,255,255,.35), 0 6px 14px -6px var(--pc);
}
.av.two { font-size: calc(var(--s, 34px) * .36); letter-spacing: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  font-size: .72rem; font-weight: 800; background: var(--track); color: var(--ink2); white-space: nowrap;
}
.chip svg { width: 12px; height: 12px; }
.chip.gold { background: rgba(240,173,27,.18); color: #8a5d00; }
.chip.hot { background: rgba(229,72,77,.14); color: var(--bad); }
.chip.cold { background: rgba(70,150,255,.16); color: #2f7ae5; }
.chip.good { background: rgba(19,166,120,.15); color: var(--good); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.gold { color: #f7c755; } }
:root[data-theme="dark"] .chip.gold { color: #f7c755; }
.mv { display: inline-flex; align-items: center; gap: 2px; font-size: .72rem; font-weight: 800; }
.mv.up { color: var(--good); } .mv.down { color: var(--bad); } .mv.flat { color: var(--muted); }
.mv::before { content: ""; border: 4px solid transparent; }
.mv.up::before { border-bottom: 6px solid currentColor; border-top: 0; }
.mv.down::before { border-top: 6px solid currentColor; border-bottom: 0; }
.mv.flat::before { width: 7px; height: 2px; border: 0; background: currentColor; border-radius: 2px; }

/* ---------- alert ------------------------------------------------------------ */
.alert {
  margin-top: 16px; padding: 14px 18px; border-radius: var(--r2); color: #fff; text-align: center;
  background: linear-gradient(120deg, #e5484d, #ff7a59); box-shadow: 0 14px 34px -14px #e5484d;
  animation: pulse 1.8s ease-in-out infinite;
}
.alert b { display: block; font-size: 1.15rem; letter-spacing: .01em; }
.alert small { opacity: .9; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .68rem; }
@keyframes pulse { 50% { box-shadow: 0 14px 44px -6px #e5484d; transform: scale(1.012); } }

/* ---------- hero / podium ---------------------------------------------------- */
.hero-top { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
.hero h1 { margin: 6px 0 4px; font-size: clamp(1.7rem, 6.4vw, 2.7rem); line-height: 1.05; letter-spacing: -.045em; font-weight: 800; }
.hero .lead { color: var(--ink2); font-weight: 600; font-size: .92rem; }
.ring { position: relative; flex: none; width: 92px; height: 92px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--track); }
.ring .arc { stroke-linecap: round; stroke-dasharray: var(--c) var(--c); stroke-dashoffset: var(--c); transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1) .2s; }
.in .ring .arc, .ring.in .arc { stroke-dashoffset: var(--o); }
.ring .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring .mid b { font-size: 1.35rem; letter-spacing: -.04em; }
.ring .mid small { display: block; color: var(--muted); font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }

.podium { display: flex; align-items: flex-end; justify-content: center; gap: clamp(6px, 2.4vw, 18px); margin-top: 22px; padding-top: 28px; }
.pod { flex: 1 1 0; max-width: 150px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
.pod[data-rank="1"] { order: 2; } .pod[data-rank="2"] { order: 1; }
.pod[data-rank="3"] { order: 3; } .pod[data-rank="4"] { order: 4; }
.pod .crown { position: absolute; top: -26px; width: 30px; height: 30px; color: var(--gold); filter: drop-shadow(0 4px 6px rgba(240,173,27,.45)); animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg); } }
.pod .nm { margin-top: 8px; font-weight: 800; font-size: .95rem; letter-spacing: -.02em; }
.pod .pts { font-size: 1.55rem; font-weight: 800; letter-spacing: -.045em; line-height: 1.1; }
.pod .gap { color: var(--muted); font-size: .72rem; font-weight: 700; min-height: 1.1em; }
.pillar {
  width: 100%; margin-top: 10px; height: 0; border-radius: 18px 18px 8px 8px; position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--pc), var(--pc-m)); transition: height 1.1s cubic-bezier(.2,.9,.25,1.15) .15s;
  box-shadow: 0 16px 30px -18px var(--pc);
}
.in .pillar, .pillar.in { height: var(--ph); }
.pillar::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 40%; background: linear-gradient(180deg, rgba(255,255,255,.35), transparent); }
.pillar .rk { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 2rem; font-weight: 800; color: #fff; opacity: .85; text-shadow: 0 2px 10px rgba(0,0,0,.18); }
.pod .mv { margin-top: 2px; }
@media (min-width: 900px) {
  .hero { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.25fr); gap: 28px; align-items: center; }
  .hero-top { flex-direction: column; align-items: flex-start; gap: 22px; }
  .hero .podium { margin-top: 0; padding-top: 34px; }
  .ring { width: 112px; height: 112px; }
}

/* ---------- today ------------------------------------------------------------ */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.tile { padding: 12px 6px; text-align: center; border-radius: var(--r2); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.tile.top1 { border-color: var(--pc); box-shadow: 0 14px 30px -16px var(--pc); }
.tile .av { margin: 0 auto 6px; }
.tile .v { font-size: 1.5rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.tile small { display: block; margin-top: 3px; color: var(--muted); font-weight: 700; font-size: .7rem; }
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; margin: 0 -2px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.gcard { flex: 0 0 82%; max-width: 310px; scroll-snap-align: start; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
@media (min-width: 900px) {
  .rail { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; }
  .gcard { max-width: none; }
}
.gh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.gem { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: .95rem; background: var(--gc); box-shadow: 0 8px 16px -8px var(--gc); }
.gem.img { background: transparent; box-shadow: 0 8px 16px -10px rgba(0,0,0,.45); }
.gem img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; display: block; }
.gh b { font-size: 1.02rem; letter-spacing: -.02em; }
.grow { display: flex; align-items: center; gap: 9px; padding: 7px 4px; border-radius: 12px; }
.grow + .grow { border-top: 1px dashed var(--line); }
.plc { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .76rem; flex: none; background: var(--track); color: var(--ink2); }
.plc.p1 { background: var(--gold); color: #5b3b00; } .plc.p2 { background: var(--silver); color: #2b3347; } .plc.p3 { background: var(--bronze); color: #3d2208; }
.grow .nm { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .sc { font-weight: 700; color: var(--ink2); font-size: .94rem; }
.grow .pt { min-width: 34px; text-align: center; font-size: .74rem; font-weight: 800; padding: 3px 7px; border-radius: 999px; background: var(--pc-s); color: var(--ink); }
.grow.dnp { opacity: .5; } .grow.dnp .sc { font-weight: 600; font-size: .8rem; }
.gcard .nodata { color: var(--muted); padding: 18px 4px; text-align: center; font-weight: 700; }

/* ---------- odds ------------------------------------------------------------- */
.odds-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 8px; margin-bottom: 4px; }
.odds-h h3 { margin: 0; font-size: 1.12rem; font-weight: 800; letter-spacing: -.03em; }
.odds-h span { color: var(--muted); font-size: .78rem; font-weight: 700; }
.orow { padding: 12px 0; }
.orow + .orow { border-top: 1px dashed var(--line); }
.oh { display: flex; align-items: center; gap: 10px; }
.oh .who { flex: 1; min-width: 0; line-height: 1.2; }
.oh .who b { display: block; font-size: 1rem; letter-spacing: -.02em; }
.oh .who small { color: var(--muted); font-weight: 700; font-size: .74rem; }
.oh .win { text-align: right; line-height: 1; }
.oh .win b { font-size: 1.7rem; font-weight: 800; letter-spacing: -.05em; }
.oh .win small { display: block; margin-top: 2px; color: var(--muted); font-weight: 800; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; }
.obar { display: flex; height: 12px; margin: 10px 0 7px; border-radius: 999px; overflow: hidden; background: var(--track); gap: 2px; }
.obar i { display: block; flex: var(--f) 1 0; min-width: 0; background: var(--pc); border-radius: 3px; transform: scaleX(0); transform-origin: left; transition: transform .9s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--d, 0ms) + var(--k) * 90ms); }
.obar i:first-child { border-radius: 999px 3px 3px 999px; } .obar i:last-child { border-radius: 3px 999px 999px 3px; }
.obar i:nth-child(1) { background: var(--gold); }
.obar i:nth-child(2) { background: var(--silver); }
.obar i:nth-child(3) { background: var(--bronze); }
.obar i:nth-child(4) { background: var(--slate); }
.oplaces span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--slate); }
.oplaces span:nth-child(1)::before { background: var(--gold); }
.oplaces span:nth-child(2)::before { background: var(--silver); }
.oplaces span:nth-child(3)::before { background: var(--bronze); }
.plegend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 6px 0; color: var(--muted); font-size: .76rem; font-weight: 700; }
.plegend span { display: inline-flex; align-items: center; gap: 6px; }
.plegend i { width: 14px; height: 8px; border-radius: 4px; }
.plegend .k1 { background: var(--gold); } .plegend .k2 { background: var(--silver); }
.plegend .k3 { background: var(--bronze); } .plegend .k4 { background: var(--slate); }
.in .obar i, .obar.in i { transform: scaleX(1); }
.oplaces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.oplaces span { text-align: center; font-size: .68rem; color: var(--muted); font-weight: 700; }
.oplaces b { display: block; color: var(--ink); font-size: .84rem; }
details.how { margin-top: 12px; }
details.how summary { cursor: pointer; font-weight: 800; font-size: .78rem; color: var(--ink2); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::before { content: "+"; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--track); font-size: .85rem; }
details.how[open] summary::before { content: "\2212"; }

/* ---------- week lanes ------------------------------------------------------- */
.lane { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.lane .trk { flex: 1; height: 14px; border-radius: 999px; background: var(--track); overflow: hidden; }
.lane .trk i { display: block; height: 100%; width: var(--w); border-radius: 999px; background: linear-gradient(90deg, var(--pc-m), var(--pc)); transform: scaleX(0); transform-origin: left; transition: transform 1.1s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.in .lane .trk i, .lane.in .trk i { transform: scaleX(1); }
.lane .nm { width: 64px; font-weight: 700; font-size: .92rem; }
.lane .v { width: 40px; text-align: right; font-weight: 800; letter-spacing: -.03em; }

/* ---------- chart ------------------------------------------------------------ */
.chartbox { position: relative; touch-action: pan-y; }
.chartbox svg { display: block; width: 100%; overflow: visible; }
.chartbox .gridl { stroke: var(--line); stroke-width: 1; }
.chartbox .axis { fill: var(--muted); font-size: 10.5px; font-weight: 700; }
.chartbox .ln { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chartbox .xh { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 3 4; }
.tip {
  position: absolute; top: 6px; left: 0; pointer-events: none; min-width: 150px; z-index: 5;
  background: var(--solid); border: 1px solid var(--line2); border-radius: 14px; padding: 9px 11px;
  box-shadow: var(--shadow); font-size: .78rem; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s;
}
.tip.on { opacity: 1; transform: none; }
.tip .d { color: var(--muted); font-weight: 800; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; }
.tip .r { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; font-weight: 700; }
.tip .r i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); flex: none; }
.tip .r em { margin-left: auto; font-style: normal; font-weight: 800; }
.tip .r small { color: var(--muted); font-weight: 700; min-width: 30px; text-align: right; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.lg { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: .82rem; cursor: pointer; transition: opacity .2s, transform .2s; }
.lg i { width: 11px; height: 11px; border-radius: 50%; background: var(--pc); }
.lg:hover { transform: translateY(-1px); }
.lg.off { opacity: .4; } .lg.off i { background: var(--muted); }

/* ---------- champions -------------------------------------------------------- */
.shelf { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.trophy {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.trophy .n { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 1.05rem; letter-spacing: -.03em; }
.trophy svg { width: 18px; height: 18px; color: var(--gold); }
.trophy.zero { filter: grayscale(.65); box-shadow: none; }
.seasons { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; scrollbar-width: none; }
.seasons::-webkit-scrollbar { display: none; }
.scard { flex: 0 0 82%; max-width: 330px; scroll-snap-align: start; padding: 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.scard.done::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--gold), #ffd978, var(--gold)); }
.scard.live { border-color: var(--line2); }
.scard .sh { display: flex; justify-content: space-between; align-items: baseline; }
.scard .sh b { font-size: 1.05rem; letter-spacing: -.03em; }
.scard .sh span { color: var(--muted); font-weight: 700; font-size: .74rem; }
.scard .rg { color: var(--muted); font-weight: 700; font-size: .74rem; margin-top: 2px; }
.champ { display: flex; align-items: center; gap: 12px; margin: 14px 0 10px; }
.champ .who { line-height: 1.15; }
.champ .who small { display: block; font-weight: 800; font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.champ .who b { font-size: 1.3rem; letter-spacing: -.04em; }
.champ svg { width: 22px; height: 22px; color: var(--gold); margin-left: auto; }
.mini { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: .86rem; font-weight: 700; color: var(--ink2); }
.mini span { display: flex; align-items: center; gap: 7px; }
.mini i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.mini b { color: var(--ink); }

/* ---------- stats tabs ------------------------------------------------------- */
.seg { display: flex; gap: 4px; overflow-x: auto; padding: 4px; border-radius: 999px; background: var(--track); scrollbar-width: none; margin-bottom: 14px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 0; background: transparent; padding: 8px 15px; border-radius: 999px; font-weight: 800; font-size: .84rem; color: var(--ink2); cursor: pointer; transition: background .25s, color .25s, box-shadow .25s; }
.seg button.on { background: var(--solid); color: var(--ink); box-shadow: 0 4px 12px -4px rgba(20,24,60,.3); }
.pane { animation: paneIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes paneIn { from { opacity: 0; transform: translateY(10px); } }
.frow { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.frow + .frow { border-top: 1px dashed var(--line); }
.frow .who { width: 84px; font-weight: 800; line-height: 1.15; }
.frow .who .chips { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
.spark { flex: 1; display: flex; align-items: flex-end; gap: 3px; height: 44px; }
.spark i { flex: 1; max-width: 16px; min-height: 3px; border-radius: 5px 5px 2px 2px; background: var(--pc); height: var(--h); transform-origin: bottom; animation: growY .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 18ms); }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes growX { from { transform: scaleX(0); } }
.frow .meta { text-align: right; width: 64px; line-height: 1.15; }
.frow .meta b { font-size: 1.15rem; letter-spacing: -.03em; }
.frow .meta small { display: block; color: var(--muted); font-weight: 700; font-size: .68rem; }

.mx { display: grid; gap: 6px; }
.mx .c { border-radius: 14px; padding: 9px 4px; text-align: center; background: var(--track); font-weight: 800; line-height: 1.1; min-height: 52px; display: grid; place-content: center; }
.mx .c .sc { white-space: nowrap; font-size: .92rem; }
.mx .c small { display: block; color: var(--muted); font-weight: 700; font-size: .64rem; margin-top: 2px; }
.mx .h { background: transparent; min-height: 0; padding: 0; }
.mx .self { background: transparent; color: var(--muted); }
.mx .c.win { background: linear-gradient(160deg, var(--pc-m), var(--pc-s)); }

.gstats { display: grid; gap: 12px; }
@media (min-width: 760px) { .gstats { grid-template-columns: 1fr 1fr; } }
.gs { padding: 14px; border-radius: var(--r2); background: var(--track); }
.gs .gh { margin-bottom: 6px; }
.gs .rec { font-size: .74rem; font-weight: 800; color: var(--gold); margin: -2px 0 8px 44px; }
.gs table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.gs th { color: var(--muted); font-size: .62rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; text-align: right; padding: 2px 4px 6px; }
.gs th:first-child, .gs td:first-child { text-align: left; }
.gs td { padding: 6px 4px; text-align: right; font-weight: 700; border-top: 1px solid var(--line); }
.gs td:first-child { display: flex; align-items: center; gap: 7px; }
.gs td.skip { color: var(--bad); }
.gs tr.dimr { opacity: .45; }

.heat { display: grid; grid-template-columns: 44px repeat(7, 1fr); gap: 5px; align-items: stretch; }
.heat .hd { text-align: center; font-size: .66rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-bottom: 2px; }
.heat .hd small { display: block; text-transform: none; letter-spacing: 0; font-weight: 700; font-size: .6rem; }
.heat .cell { border-radius: 10px; min-height: 40px; display: grid; place-content: center; text-align: center; font-weight: 800; font-size: .84rem; line-height: 1.05; background: var(--track); position: relative; }
.heat .cell.best { box-shadow: inset 0 0 0 2px var(--gold); }
.heat .cell em { font-style: normal; display: block; color: var(--bad); font-size: .58rem; font-weight: 800; }
.heat .av { margin: auto; }

.stack { display: flex; height: 26px; border-radius: 9px; overflow: hidden; gap: 2px; background: var(--track); }
.stack i { display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: .72rem; color: var(--ink); background: var(--pc-m); flex: var(--f) 1 0; min-width: 0; transform-origin: left; animation: growX .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k) * 80ms); }
.stack i:nth-child(1) { background: var(--gold); color: #4a3000; }
.stack i:nth-child(2) { background: var(--silver); color: #1f2740; }
.stack i:nth-child(3) { background: var(--bronze); color: #2e1a06; }
.stack i:nth-child(4) { background: var(--slate); color: #fff; }
.stack i.dnp { background: repeating-linear-gradient(45deg, var(--line2) 0 4px, transparent 4px 8px); color: var(--ink2); }
.fin { padding: 10px 0; } .fin + .fin { border-top: 1px dashed var(--line); }
.fin .fh { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.fin .fh b { flex: 1; letter-spacing: -.02em; }
.fin .fh small { color: var(--muted); font-weight: 800; font-size: .72rem; }
.wk { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.wk::-webkit-scrollbar { display: none; }
.wk button { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: .78rem; cursor: pointer; color: var(--ink2); }
.wk button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.dots { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.dots::-webkit-scrollbar { display: none; }
.dot { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: .74rem; font-weight: 800; background: var(--track); color: var(--ink2); }
.dot.p1 { background: var(--gold); color: #5b3b00; } .dot.p2 { background: var(--silver); color: #2b3347; } .dot.p3 { background: var(--bronze); color: #3d2208; }
.cnt { display: flex; gap: 6px; }
.cnt span { flex: 1; text-align: center; padding: 6px 0; border-radius: 10px; background: var(--track); font-weight: 800; line-height: 1.1; font-size: 1.05rem; }
.cnt small { display: block; color: var(--muted); font-size: .6rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.rcards { display: grid; gap: 12px; }
@media (min-width: 760px) { .rcards { grid-template-columns: 1fr 1fr; } }
.rc { padding: 14px; border-radius: var(--r2); background: var(--track); }
.rc .rh { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.rc .rh b { font-size: 1rem; letter-spacing: -.02em; }
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kv div { background: var(--surface); border-radius: 12px; padding: 8px 10px; line-height: 1.15; }
.kv b { font-size: 1.3rem; letter-spacing: -.04em; display: block; }
.kv small { color: var(--muted); font-weight: 700; font-size: .68rem; }
.swing { padding: 9px 12px; margin-top: 8px; border-radius: 12px; background: var(--track); font-size: .82rem; font-weight: 600; color: var(--ink2); }
.swing b { color: var(--ink); }
.bars .frow .who { width: 74px; }
.bars .bar { flex: 1; height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bars .bar i { display: block; height: 100%; width: var(--w); background: var(--pc); border-radius: 999px; opacity: .8; }
.bars .n { width: 32px; text-align: right; font-weight: 800; }
.sub-l { color: var(--muted); font-size: .74rem; font-weight: 700; margin: 2px 0 8px 94px; }

/* ---------- history ---------------------------------------------------------- */
details.fold { border-radius: var(--r2); background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; box-shadow: var(--shadow); }
details.fold > summary { cursor: pointer; padding: 15px 18px; font-weight: 800; letter-spacing: -.02em; list-style: none; display: flex; align-items: center; justify-content: space-between; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .25s; margin-right: 4px; }
details.fold[open] > summary::after { transform: rotate(-135deg); }
.tbw { overflow-x: auto; padding: 0 12px 14px; max-height: 520px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th { position: sticky; top: 0; background: var(--solid); color: var(--muted); font-size: .64rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; text-align: right; padding: 8px 8px; }
.tbl td { padding: 8px; text-align: right; border-top: 1px solid var(--line); font-weight: 600; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td.w { font-weight: 800; color: var(--ink); background: var(--pc-s); border-radius: 8px; }
.tbl tr.miss td { color: var(--muted); font-style: italic; }

.foot { margin-top: 36px; text-align: center; color: var(--ink2); font-size: .76rem; font-weight: 700; }

/* the page is made of motion; honour people who don't want it */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .rv { opacity: 1; transform: none; }
}

/* ---------- ratings tab ------------------------------------------------------ */
.rate { padding: 12px 0; }
.rate + .rate { border-top: 1px dashed var(--line); }
.rate .rt { display: flex; align-items: center; gap: 10px; }
.rate .who { flex: 1; line-height: 1.2; }
.rate .who b { display: block; letter-spacing: -.02em; }
.rate .who small { color: var(--muted); font-weight: 700; font-size: .74rem; }
.rate .big { font-size: 1.7rem; font-weight: 800; letter-spacing: -.04em; }
.rgames { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.rg { border-radius: 12px; padding: 7px 2px 6px; text-align: center; font-weight: 800; font-size: .78rem; line-height: 1; }
.rg .gem { width: 24px; height: 24px; border-radius: 8px; margin: 0 auto 5px; font-size: .7rem; }
.rg span { display: block; }

/* ---------- keyboard focus and freshness ------------------------------------ */
:focus-visible { outline: 3px solid var(--p0); outline-offset: 3px; border-radius: 10px; }
.nav a:focus-visible, .seg button:focus-visible, .lg:focus-visible, .iconbtn:focus-visible,
.wk button:focus-visible { outline-offset: 1px; }
.rail:focus-visible, .seasons:focus-visible { outline-offset: -2px; border-radius: var(--r); }
.stale { margin-top: 16px; padding: 12px 16px; border-radius: var(--r2); font-size: .86rem; font-weight: 600;
         background: rgba(240,173,27,.18); border: 1px solid rgba(240,173,27,.6); color: var(--ink); }
.stale b { font-weight: 800; }

/* ---------- what if ---------------------------------------------------------- */
.wic { padding: 12px 0; }
.wic + .wic { border-top: 1px dashed var(--line); }
.wih { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.wih .who { flex: 1; line-height: 1.2; }
.wirow { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.wirow label { width: 96px; flex: none; color: var(--ink2); font-weight: 700; font-size: .8rem; }
.step { display: flex; align-items: center; gap: 6px; }
.step button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); font-weight: 800; cursor: pointer; }
.step button:active { transform: scale(.94); }
.step b { min-width: 42px; text-align: center; }
.wirow input[type=range] { flex: 1; min-width: 0; accent-color: var(--pc); }
.wirow .val { width: 46px; text-align: right; font-weight: 800; }
.seg2 { display: inline-flex; gap: 3px; padding: 3px; border-radius: 999px; background: var(--track); flex-wrap: wrap; }
.seg2 button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-weight: 800; font-size: .78rem; color: var(--ink2); cursor: pointer; }
.seg2 button.on { background: var(--solid); color: var(--ink); box-shadow: 0 3px 10px -4px rgba(20,24,60,.35); }
.mini-btn { border: 1px solid var(--line2); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-weight: 800; font-size: .74rem; color: var(--ink2); cursor: pointer; }
.wibar { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.dchip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 800; }
.dchip.up { background: rgba(19,166,120,.16); color: #0a6e50; }
.dchip.down { background: rgba(229,72,77,.14); color: #b3262b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .dchip.up { color: #4fe3b3; }
  :root:not([data-theme="light"]) .dchip.down { color: #ff8a8e; }
}
:root[data-theme="dark"] .dchip.up { color: #4fe3b3; }
:root[data-theme="dark"] .dchip.down { color: #ff8a8e; }
.wsum { padding: 10px 12px; margin: 8px 0 4px; border-radius: 12px; background: var(--track); font-weight: 700; font-size: .86rem; }

/* ---------- needs a score --------------------------------------------------- */
.gday + .gday { margin-top: 10px; }
.gdate { color: var(--muted); font-weight: 800; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
.gchips { display: flex; flex-wrap: wrap; gap: 8px; }
.gchip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 6px 5px 5px; border-radius: 999px; border: 1px solid var(--line2);
         background: var(--surface); font-size: .84rem; font-weight: 700; transition: transform .2s, border-color .2s; }
.gchip:hover { transform: translateY(-1px); border-color: var(--pc); }
.gchip b { font-weight: 800; }
.gchip span:not(.av) { color: var(--ink2); }
.gchip i { font-style: normal; font-size: .7rem; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: var(--ink); color: var(--bg); }
.gline { font-size: .84rem; font-weight: 700; color: var(--ink2); padding: 2px 0; }
.selfchip { display: inline-block; vertical-align: 1px; margin-left: 4px; padding: 0 6px; border-radius: 999px; font-size: .62rem; font-weight: 800;
            letter-spacing: .04em; text-transform: uppercase; background: rgba(240,173,27,.2); color: #8a5d00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .selfchip { color: #f7c755; } }
:root[data-theme="dark"] .selfchip { color: #f7c755; }

/* ---- unofficial scoring preview ---- */
.pvban { margin: 0 0 14px; padding: 10px 14px; border-radius: 12px; background: var(--track); border: 1px dashed var(--line); font-size: 14px; }
.pvban b { color: var(--gold); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; margin-right: 6px; }
.pvrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.pvrow + .pvrow { border-top: 1px dashed var(--line); }
.pvrow .who { flex: 1; min-width: 0; }
.pvrow .who small, .pvn small { display: block; opacity: .7; font-size: 12px; }
.pvn { text-align: right; } .pvn b { font-size: 22px; font-variant-numeric: tabular-nums; }
.pvrow .win { text-align: right; min-width: 52px; } .pvrow .win b { font-size: 18px; } .pvrow .win small { display: block; opacity: .7; font-size: 11px; }
.pvscroll { overflow-x: auto; }
.pvt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.pvt th, .pvt td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
.pvt th:first-child, .pvt td.wk { text-align: left; }
.pvt td.wk em { display: block; font-style: normal; font-size: 11px; opacity: .6; }
.pvt td.lead { font-weight: 700; color: var(--gold); }
.pvt tr.projected td { opacity: .75; }
.pvproj { font-size: 11px; opacity: .75; margin-top: 2px; }

</style>

/* ---------- per-theme player colours -------------------------------------- */
(() => {
  const rgb = (h) => { const x = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(x.substr(i, 2), 16)); };
  const lum = (h) => { const c = rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const lumA = (a) => { const c = a.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const hex = (a) => '#' + a.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
  // the disc colour and initials colour that give the best readable pair for this hue
  const disc = (h) => {
    const base = rgb(h), L = lumA(base);
    const white = 1.05 / (L + 0.05) >= (L + 0.05) / 0.0585, target = white ? 0 : 255;
    for (let t = 0; t <= 0.6; t += 0.03) {
      const m = base.map((v) => v + (target - v) * t), Lm = lumA(m);
      if ((white ? 1.05 / (Lm + 0.05) : (Lm + 0.05) / 0.0585) >= 4.6) return [hex(m), white ? '#fff' : '#16171e'];
    }
    return [h, white ? '#fff' : '#16171e'];
  };
  const block = (cols) => P.map((p) => {
    const h = cols[p.slot], c = rgb(h).join(','), d = disc(h);
    return `--p${p.slot}:${h};--p${p.slot}-s:rgba(${c},.16);--p${p.slot}-m:rgba(${c},.42);--p${p.slot}-ink:${d[1]};--p${p.slot}-av:${d[0]};`;
  }).join('');
  const st = document.createElement('style');
  st.textContent = `:root{${block(D.colorsLight)}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${block(D.colorsDark)}}}:root[data-theme="dark"]{${block(D.colorsDark)}}`;
  document.head.appendChild(st);
})();

/* ---------- motion: reveal on scroll, count-up --------------------------- */
const countUp = (n) => {
  if (n._done) return; n._done = true;
  const to = parseFloat(n.getAttribute('data-count')), dec = +n.getAttribute('data-dec') || 0;
  const pre = n.getAttribute('data-pre') || '', suf = n.getAttribute('data-suf') || '';
  const fmt = (v) => pre + v.toFixed(dec) + suf;
  if (REDUCE || !isFinite(to)) { n.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 1100;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    n.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
};
const runCounts = (root) => { $$('[data-count]', root).forEach(countUp); if (root.matches && root.matches('[data-count]')) countUp(root); };
const io = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); runCounts(e.target); io.unobserve(e.target); } });
}, { threshold: 0.1, rootMargin: '0px 0px -5% 0px' }) : null;
const watch = (root) => {
  $$('.rv', root).forEach((n) => { if (!io || REDUCE) { n.classList.add('in'); runCounts(n); } else io.observe(n); });
  if (root.classList && root.classList.contains('pane')) runCounts(root);
};

/* ---------- spotlight: tap a player to highlight them everywhere ---------- */
let FOCUS = null;
const makeKeyboardFriendly = (root) => $$('[data-fb]', root).forEach((n) => {
  if (n.tagName === 'BUTTON' || n.hasAttribute('tabindex')) return;
  n.setAttribute('tabindex', '0');
  n.setAttribute('role', 'button');
});
const applyFocus = () => {
  makeKeyboardFriendly(document);
  $$('[data-p]').forEach((n) => n.classList.toggle('dim', !!FOCUS && n.getAttribute('data-p') !== FOCUS));
  $$('[data-fb]').forEach((n) => n.setAttribute('aria-pressed', String(FOCUS === n.getAttribute('data-fb'))));
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-fb]');
  if (!t) return;
  FOCUS = FOCUS === t.getAttribute('data-fb') ? null : t.getAttribute('data-fb');
  applyFocus(); drawChart();
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-fb]')) {

});

function renderAlert() {

/* ---- race hero ---- */
const rankAt = (i) => {
  const order = D.standings.map((s) => s.player);
  const arr = P.map((p) => ({ id: p.id, v: D.series.cumulative[p.id][i] }));
  arr.sort((a, b) => b.v - a.v || order.indexOf(a.id) - order.indexOf(b.id));
  const r = {}; arr.forEach((a, k) => { r[a.id] = k + 1; });
  return r;
};
function renderRace() {
  const st = D.standings, w = D.seasonNow;
  if (!st.length) { $('#race').innerHTML = ''; return; }
  const lead = st[0], run = st[1], lp = BY[lead.player], rp = run ? BY[run.player] : null;
  const gap = run ? lead.points - run.points : 0;
  let head, lede;
  if (!lead.points) { head = 'A <span class="grad">fresh</span> season'; lede = 'Everyone starts at zero. Play on.'; }
  else if (gap === 0) { head = `${esc(lp.first)} &amp; ${esc(rp.first)} are <span class="grad">level</span>`; lede = 'A dead heat at the top.'; }
  else { head = `${esc(lp.first)} leads by <span class="grad">${gap}</span>`; lede = `${esc(rp.first)} is the closest chaser.`; }
  const left = w ? (w.days_left === 0 ? 'Final day' : `${w.days_left} day${w.days_left === 1 ? '' : 's'} left`) : '';
  const frac = w ? Math.min(1, Math.max(0, (w.weeks * 7 - w.days_left) / (w.weeks * 7))) : 0;
  const C = 2 * Math.PI * 40;
  const ring = w ? `<div class="ring" style="--c:${C.toFixed(1)};--o:${(C * (1 - frac)).toFixed(1)}">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--p0)"/><stop offset="1" style="stop-color:var(--p3)"/></linearGradient></defs>
      <circle class="trk" cx="50" cy="50" r="40" fill="none" stroke-width="9"/><circle class="arc" cx="50" cy="50" r="40" fill="none" stroke="url(#rg)" stroke-width="9"/></svg>
      <div class="mid"><div><b>${w.week_index}</b><small>of ${w.weeks} wks</small></div></div></div>` : '';
  const n = D.series.days.length;
  const now = n ? rankAt(n - 1) : null, prev = n > 1 ? rankAt(n - 2) : null;
  const max = Math.max(1, ...st.map((s) => s.points));
  const pods = st.map((s, i) => {
    const p = BY[s.player], rank = i + 1, ph = 46 + Math.round(124 * (s.points / max));
    const d = prev ? prev[p.id] - now[p.id] : 0;
    const mv = prev && d ? `<span class="mv ${d > 0 ? 'up' : 'down'}">${Math.abs(d)}</span>` : '';
    return `<div class="pod" data-rank="${rank}" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)};--ph:${ph}px">
      ${rank === 1 && s.points > 0 ? `<span class="crown">${I.crown}</span>` : ''}
      ${av(p, 54)}<div class="nm">${esc(p.first)}</div>
      <div class="pts" data-count="${s.points}">0</div>
      <div class="gap">${rank === 1 ? (s.points ? 'leader' : '') : MINUS + (lead.points - s.points)}</div>${mv}
      <div class="pillar"><span class="rk">${rank}</span></div></div>`;
  }).join('');
  $('#race').innerHTML = `<div class="card hero rv">
    <div class="hero-top"><div><div class="eyebrow">${w ? esc(w.label) + ' ' + MID + ' ' + esc(w.range) : 'Season standings'}</div>
      <h1>${head}</h1><div class="lead">${lede}${left ? ' ' + MID + ' ' + left : ''}</div></div>${ring}</div>
    <div class="podium">${pods}</div></div>`;
  watch($('#race'));
}

/* ---- scores that look missing, and self-reported ones awaiting confirmation ---- */
function gapsCard() {

/* ---- odds ---- */
function oddsCard(F, title, right, how) {
  if (!F) return '';

  const rows = order.map((p, i) => {
    const f = F.players[p.id], m = f.margin;
    const win = f.win > 0.005 && f.win < 0.995 ? `<b data-count="${Math.round(f.win * 100)}" data-suf="%">0%</b>` : `<b>${fcPct(f.win)}</b>`;
    const segs = f.places.map((v, k) => `<i style="--f:${Math.max(v, 0.0001)};--k:${k}"></i>`).join('');
    return `<div class="orow rv" data-p="${p.id}" style="${pv(p)};--d:${i * 80}ms">

  }).join('');
  return `<div class="card"><div class="odds-h"><h3>${title}</h3><span>${right}</span></div>${rows}

/* ======================================================================
   What if? A browser port of the forecast simulation (league/model.py), so the
   assumptions can be changed and the odds recomputed on the spot. Every random
   number is drawn in a fixed order whatever the assumptions are, so a scenario
   and its baseline share the same luck and any difference between them is real.
   ====================================================================== */
const makeRng = (seed) => {
  let a = seed >>> 0, spare = null;
  const rand = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const gauss = () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0; while (u === 0) u = rand();
    const v = rand(), m = Math.sqrt(-2 * Math.log(u));
    spare = m * Math.sin(2 * Math.PI * v);
    return m * Math.cos(2 * Math.PI * v);
  };
  const gamma = (k) => {
    if (k < 1) return gamma(k + 1) * Math.pow(rand() || 1e-12, 1 / k);
    const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
    for (;;) {
      let x, v;
      do { x = gauss(); v = 1 + c * x; } while (v <= 0);
      v = v * v * v;
      const u = rand();
      if (u < 1 - 0.0331 * x * x * x * x || Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v;
    }
  };
  const beta = (p, q) => { const x = gamma(p), y = gamma(q); return x / (x + y); };
  return { rand, gauss, beta };
};

// Play `dates` forward `sims` times; returns the points each player earns in each run.
const whatIfSim = (M, dates, sims, seed, opt) => {
  const n = M.players.length, G = M.slugs.length, L = M.pts.length, rng = makeRng(seed), DAY = 86400000;
  const ts = dates.map((s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)));
  const mon0 = ts.length ? ts[0] - ((new Date(ts[0]).getUTCDay() + 6) % 7) * DAY : 0;
  const plan = ts.map((t) => Math.floor((t - mon0) / (7 * DAY)));
  const nb = plan.length ? Math.max.apply(null, plan) + 1 : 0;
  const out = [];
  for (let s = 0; s < sims; s++) {
    const th = M.theta.map((t, i) => t + M.skillUnc * M.thetaSd[i] * rng.gauss());
    const ar = M.aAB.map((ab) => rng.beta(ab[0], ab[1]));
    const rg = M.rAB.map((row) => row.map((ab) => rng.beta(ab[0], ab[1])));
    const eps = [];
    for (let b = 0; b < nb; b++) { const e = []; for (let i = 0; i < n; i++) e.push(rng.gauss() * M.weeklySd); eps.push(e); }
    for (let i = 0; i < n; i++) {            // the scenario is applied after the luck is drawn
      th[i] += opt.shift[i];
      if (opt.mode[i] === 'skip') ar[i] = 0;
      else if (opt.mode[i] === 'always') { ar[i] = 1; for (let g = 0; g < G; g++) rg[i][g] = 1; }
    }
    const tot = new Array(n).fill(0);
    for (let di = 0; di < plan.length; di++) {
      const e = eps[plan[di]], up = [];
      for (let i = 0; i < n; i++) up.push(rng.rand());
      for (let g = 0; g < G; g++) {
        const uq = [], uk = [], ut = [];
        for (let i = 0; i < n; i++) { uq.push(rng.rand()); uk.push(rng.rand()); ut.push(rng.rand()); }
        const who = [];
        for (let i = 0; i < n; i++) if (up[i] < ar[i] && uq[i] < rg[i][g]) who.push(i);
        if (!who.length) continue;
        if (who.length === 1) { tot[who[0]] += M.pts[0]; continue; }
        const keys = who.map((i) => [th[i] + M.delta[g][i] + M.form[i] + e[i] - Math.log(-Math.log(uk[i] || 1e-12)), i])
          .sort((x, y) => y[0] - x[0]);
        let prev = 1;
        for (let pos = 0; pos < keys.length; pos++) {
          const r = pos === 0 ? 1 : (ut[pos] < M.tie[g] ? prev : pos + 1);
          tot[keys[pos][1]] += M.pts[Math.min(r, L) - 1];
          prev = r;
        }

    }
    out.push(tot);
  }

};

// Odds of each finishing place from simulated runs; tied totals split the places.
const tallyOdds = (ids, startAt, runs) => {
  const n = ids.length, places = ids.map(() => new Array(n).fill(0)), sum = new Array(n).fill(0);
  runs.forEach((r) => {
    const tot = r.map((v, i) => v + startAt[i]);
    const order = tot.map((_, i) => i).sort((a, b) => tot[b] - tot[a]);
    let j = 0;
    while (j < n) {
      let k = j;
      while (k + 1 < n && tot[order[k + 1]] === tot[order[j]]) k++;
      const share = 1 / (k - j + 1);
      for (let m = j; m <= k; m++) for (let sl = j; sl <= k; sl++) places[order[m]][sl] += share;
      j = k + 1;
    }
    tot.forEach((v, i) => { sum[i] += v; });
  });
  const res = {};
  ids.forEach((id, i) => {
    res[id] = {
      now: startAt[i], margin: startAt[i] - Math.max.apply(null, startAt.filter((_, q) => q !== i)),
      win: places[i][0] / runs.length, places: places[i].map((x) => x / runs.length), expected: sum[i] / runs.length,
    };
  });
  return res;
};

    </div>`;
  wiPaint(); wiResults(); watch(box);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-wi]'); if (!b || !$('#whatif').contains(b)) return;
  const a = b.dataset.wi, id = b.dataset.id;
  if (a === 'bank') WI.bank[id] = (WI.bank[id] || 0) + (+b.dataset.d);
  else if (a === 'mode') WI.mode[id] = b.dataset.v;
  else if (a === 'allplay') { Object.keys(BY).forEach((k) => { WI.mode[k] = 'always'; }); }
  else if (a === 'reset') { WI.bank = {}; WI.shift = {}; WI.mode = {}; }
  else if (a === 'scope') { WI.scope = b.dataset.v; renderWhatIf(); return; }
  else return;
  wiPaint(); wiLater();
});
document.addEventListener('input', (e) => {
  const r = e.target.closest && e.target.closest('input[data-wi="shift"]'); if (!r) return;
  WI.shift[r.dataset.id] = +r.value; wiPaint(); wiLater();
});

/* ---- champions ---- */
function renderFame() {
  const seasons = (D.seasons || []).slice().reverse(), titles = D.seasonTitles || {};
  if (!seasons.length) { $('#fame').innerHTML = ''; return; }
  const shelf = sortedBy((a, b) => (titles[b.id] || 0) - (titles[a.id] || 0)).map((p) => {
    const n = titles[p.id] || 0;
    return `<div class="trophy ${n ? '' : 'zero'}" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}">${av(p, 34)}<span class="n">${esc(p.first)}${n ? ` ${I.trophy}<span>${n}</span>` : ''}</span></div>`;
  }).join('');
  const names = (ids) => ids.map((id) => esc(BY[id].first)).join(' &amp; ');
  const cards = seasons.map((s, i) => {
    const st = s.standings.slice().sort((a, b) => b.points - a.points);
    const state = s.complete ? 'done' : s.current ? 'live' : 'up';
    const tag = s.complete ? 'Complete' : s.current ? `Live ${MID} wk ${s.week_index}/${s.weeks}` : 'Upcoming';
    let champ;
    if (s.complete && s.champions.length) champ = `<div class="champ" style="${pv(BY[s.champions[0]])}">${av(BY[s.champions[0]], 46)}<div class="who"><small>Champion</small><b>${names(s.champions)}</b></div>${I.crown}</div>`;
    else if (s.current && s.leaders.length) champ = `<div class="champ" style="${pv(BY[s.leaders[0]])}">${av(BY[s.leaders[0]], 46)}<div class="who"><small style="color:var(--muted)">Leading</small><b>${names(s.leaders)}</b></div></div>`;
    else champ = `<div class="champ"><div class="who"><small style="color:var(--muted)">${s.upcoming ? 'Starts soon' : 'No champion'}</small><b>${EMD}</b></div></div>`;
    const minis = s.upcoming ? '' : st.map((x) => `<div class="mini" style="${pv(BY[x.player])}"><span><i></i>${esc(BY[x.player].first)}</span><b>${x.points}</b></div>`).join('');
    return `<div class="scard ${state} rv" style="--d:${i * 80}ms"><div class="sh"><b>${esc(s.label)}</b><span>${tag}</span></div><div class="rg">${esc(s.range)}</div>${champ}${minis}</div>`;
  }).join('');
  const career = (D.career || []).map((c) => `${esc(BY[c.player].first)} ${c.points}`).join(', ');
  $('#fame').innerHTML = `${sectionHead('Champions', 'season titles')}<div class="shelf rv">${shelf}</div><div class="seasons" tabindex="0" role="group" aria-label="Season cards: swipe, or focus here and use the arrow keys">${cards}</div>
    <p class="note" style="margin-left:6px">A season is ${seasons[0].weeks} weeks; its top scorer takes the title (ties share it). All-time points: ${career}.</p>`;
  watch($('#fame'));
}

/* ---- stats tabs ---- */
const TABS = [
  ['form', 'Form'], ['h2h', 'Head-to-head'], ['games', 'Games'], ['days', 'Weekdays'],
  ['fin', 'Finishes'], ['weekly', 'Weeks'], ['clutch', 'Clutch'], ['rec', 'Records'], ['model', 'Ratings'], ['skips', 'Skips'],
];
let TAB = 'form', FINSEL = 'all';

const tabForm = () => {
  const rows = (D.form || []).slice().sort((a, b) => b.avg - a.avg);
  if (!rows.length) return '<div class="empty">No days recorded yet.</div>';
  let max = 5; rows.forEach((f) => f.points.forEach((v) => { max = Math.max(max, v); }));
  return rows.map((f) => {
    const p = BY[f.id];
    const chip = f.streak >= 2 ? `<span class="chip hot">${I.flame}${f.streak}</span>` : f.drought >= 3 ? `<span class="chip cold">${I.snow}${f.drought}</span>` : '';
    const bars = f.points.map((v, i) => `<i style="--h:${Math.max(3, Math.round(44 * v / max))}px;--i:${i};${v ? '' : 'opacity:.3'}" title="${md(f.days[i])} ${MID} ${v} pts"></i>`).join('');
    return `<div class="frow" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}">${av(p, 36)}<div class="who">${esc(p.first)}<div class="chips">${chip}</div></div>
      <div class="spark">${bars}</div><div class="meta"><b>${f.avg}</b><small>per day <span class="mv ${f.trend === 'up' ? 'up' : f.trend === 'down' ? 'down' : 'flat'}"></span></small></div></div>`;
  }).join('') + '<p class="note">Points per day over the last 3 weeks of recorded days. The arrow compares with the 3 weeks before.</p>';
};

const tabH2H = () => {
  const n = P.length;
  let h = `<div class="mx" style="grid-template-columns:44px repeat(${n},1fr)"><div class="c h"></div>` + P.map((p) => `<div class="c h" data-p="${p.id}" style="${pv(p)}">${av(p, 30)}</div>`).join('');
  P.forEach((row) => {
    h += `<div class="c h" data-p="${row.id}" style="${pv(row)}">${av(row, 30)}</div>`;
    P.forEach((col) => {
      if (col.id === row.id) { h += '<div class="c self">' + EMD + '</div>'; return; }
      const r = D.headToHead[row.id][col.id];
      h += `<div class="c ${r.w > r.l ? 'win' : ''}" data-p="${row.id}" style="${pv(row)}"><span class="sc">${r.w}${DASH}${r.l}</span><small>${r.t} tied</small></div>`;
    });
  });
  return h + '</div><p class="note">Row against column: wins, losses and ties across every game both played. Shaded = the row player is ahead.</p>';
};

const tabGames = () => D.gameStats.map((g, gi) => {
  const rows = g.players.slice().sort((a, b) => {
    if ((a.plays > 0) !== (b.plays > 0)) return a.plays > 0 ? -1 : 1;
    const ar = a.avgRank === null ? 99 : a.avgRank, br = b.avgRank === null ? 99 : b.avgRank;
    if (ar !== br) return ar - br;
    if (a.wins !== b.wins) return b.wins - a.wins;
    return (a.bestSecs || 1e9) - (b.bestSecs || 1e9);
  });
  let rec = null, holders = [];
  rows.forEach((r) => { if (r.bestSecs === null || !r.plays) return; if (rec === null || r.bestSecs < rec) { rec = r.bestSecs; holders = [r]; } else if (r.bestSecs === rec) holders.push(r); });
  const lead = rows.length && rows[0].plays > 0 ? rows[0].id : null;
  const body = rows.map((r) => {
    const p = BY[r.id], pl = r.plays > 0;
    return `<tr class="${pl || r.missed ? '' : 'dimr'}" data-p="${p.id}" style="${pv(p)}"><td>${av(p, 22)}${esc(p.first)}${r.id === lead ? ' ' + `<span class="chip gold" style="padding:1px 6px">${I.crown}</span>` : ''}</td>
      <td>${pl ? esc(r.avgTime) : EMD}</td><td>${pl && r.avgRank !== null ? r.avgRank : EMD}</td><td>${pl ? r.wins : EMD}</td><td>${pl ? esc(r.bestTime) : EMD}</td><td class="${r.missed ? 'skip' : ''}">${r.missed || 0}</td></tr>`;
  }).join('');
  return `<div class="gs"><div class="gh" style="--gc:${GC[gi % GC.length]}">${gem(g)}<b>${esc(g.name)}</b></div>
    ${holders.length ? `<div class="rec">Record ${esc(holders[0].bestTime)} ${MID} ${holders.map((r) => esc(BY[r.id].first)).join(', ')}</div>` : ''}
    <table><tr><th></th><th>Avg</th><th>Place</th><th>Wins</th><th>Best</th><th>Skips</th></tr>${body}</table></div>`;
}).join('');

const tabDays = () => {
  const rows = D.weekdays || [];
  let max = 1; rows.forEach((r) => P.forEach((p) => { if (r.avg[p.id] !== null && r.avg[p.id] > max) max = r.avg[p.id]; }));
  let h = '<div class="heat"><div></div>' + rows.map((r) => `<div class="hd">${r.dow}<small>${r.n ? r.n + ' days' : EMD}</small></div>`).join('');
  P.forEach((p) => {
    h += `<div data-p="${p.id}" style="${pv(p)}">${av(p, 32)}</div>`;
    rows.forEach((r) => {
      const v = r.avg[p.id];
      if (v === null) { h += '<div class="cell" style="opacity:.4">' + EMD + '</div>'; return; }
      let best = true; P.forEach((q) => { if (r.avg[q.id] !== null && r.avg[q.id] > v) best = false; });
      const sk = (r.skips || {})[p.id] || 0, k = Math.round(10 + 62 * (v / max));
      h += `<div class="cell ${best && v > 0 ? 'best' : ''}" data-p="${p.id}" style="${pv(p)};background:var(--pc-s);background:color-mix(in srgb, var(--pc) ${k}%, transparent)">${v.toFixed(1)}${sk ? `<em>${sk} skip${sk > 1 ? 's' : ''}</em>` : ''}</div>`;
    });
  });
  return h + '</div><p class="note">Average points per day on that weekday. Gold ring = best that day. Red = games skipped on that weekday.</p>';
};

const finStack = (c, p) => {
  const tot = c.first + c.second + c.third + c.fourth + c.dnp || 1;
  const keys = ['first', 'second', 'third', 'fourth'];
  const seg = keys.map((k, i) => `<i style="--f:${c[k]};--k:${i}">${c[k] / tot >= 0.07 ? c[k] : ''}</i>`).join('') + (c.dnp ? `<i class="dnp" style="--f:${c.dnp};--k:4">${c.dnp / tot >= 0.07 ? c.dnp : ''}</i>` : '');
  return `<div class="fin" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="fh">${av(p, 30)}<b>${esc(p.first)}</b><small>${c.avg === null ? '' : 'avg place ' + c.avg.toFixed(2)}${c.winPct === null ? '' : ' ' + MID + ' ' + c.winPct + '% wins'}</small></div><div class="stack">${seg}</div></div>`;
};
const tabFin = () => {
  const F = D.finishes;
  if (!F || !F.weeks.length) return '<div class="empty">No finishes recorded yet.</div>';
  const sel = FINSEL === 'all' ? null : F.weeks.filter((w) => w.n === FINSEL)[0];
  const data = sel ? sel.players : F.total;
  const order = sortedBy((a, b) => (data[a.id].avg === null ? 99 : data[a.id].avg) - (data[b.id].avg === null ? 99 : data[b.id].avg));
  const chips = `<div class="wk"><button type="button" data-fin="all" class="${sel ? '' : 'on'}">All-time</button>` + F.weeks.slice().reverse().map((w) => `<button type="button" data-fin="${w.n}" class="${sel && sel.n === w.n ? 'on' : ''}">Wk ${w.n}</button>`).join('') + '</div>';
  return chips + order.map((p) => finStack(data[p.id], p)).join('') +
    `<p class="note">${sel ? esc(sel.label) + ' ' + MID + ' ' : ''}Gold = 1st, silver = 2nd, bronze = 3rd, slate = 4th; hatched = skipped a game others played. A tie for a place counts for both players.</p>`;
};

const tabWeekly = () => {
  const W = D.weeklyFinishes;
  if (!W || !W.weeks.length) return '<div class="empty">No completed weeks yet.</div>';
  const order = sortedBy((a, b) => (W.total[a.id].avg === null ? 99 : W.total[a.id].avg) - (W.total[b.id].avg === null ? 99 : W.total[b.id].avg));
  return order.map((p) => {
    const t = W.total[p.id];
    const dots = W.weeks.map((w) => `<span class="dot ${w.places[p.id] <= 3 ? 'p' + w.places[p.id] : ''}" title="Wk ${w.n} ${MID} ${w.label}">${w.places[p.id]}</span>`).join('');
    return `<div class="fin" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="fh">${av(p, 30)}<b>${esc(p.first)}</b><small>avg place ${t.avg === null ? EMD : t.avg.toFixed(2)} ${MID} ${t.weeks} weeks</small></div>
      <div class="cnt"><span>${t.first}<small>1st</small></span><span>${t.second}<small>2nd</small></span><span>${t.third}<small>3rd</small></span><span>${t.fourth}<small>4th</small></span></div>
      <div class="dots" style="margin-top:8px">${dots}</div></div>`;
  }).join('') + '<p class="note">Where each player finished in the weekly standings, completed weeks only; dots run oldest to newest.</p>';
};

const tabClutch = () => {
  const C = D.clutch;
  if (!C || !C.weeks.some((w) => w.showdown)) return '<div class="empty">No final-day showdowns yet.</div>';
  const order = sortedBy((a, b) => C.players[b.id].won - C.players[a.id].won || C.players[b.id].comebacks - C.players[a.id].comebacks);
  const cards = order.map((p) => {
    const t = C.players[p.id];
    return `<div class="rc" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="rh">${av(p, 32)}<b>${esc(p.first)}</b></div>
      <div class="kv"><div><b>${t.won} / ${t.showdowns}</b><small>won showdowns</small></div><div><b>${t.comebacks}</b><small>comebacks</small></div>
      <div><b style="${t.blown ? 'color:var(--bad)' : ''}">${t.blown}</b><small>blown leads</small></div><div><b>${t.sundayAvg === null ? EMD : t.sundayAvg.toFixed(1)}</b><small>Sunday avg</small></div></div></div>`;
  }).join('');
  const nm = (ids) => ids.map((id) => esc(BY[id].first)).join(' &amp; ');
  const swings = C.weeks.filter((w) => w.swing).reverse().map((w) => {
    const pts = P.slice().sort((a, b) => (w.sunday[b.id] || 0) - (w.sunday[a.id] || 0)).map((p) => `${esc(p.first)} ${w.sunday[p.id] || 0}`).join(', ');
    return `<div class="swing"><b>Wk ${w.n}</b> ${MID} ${esc(w.label)}: ${nm(w.leadersBefore)} ${w.lead === 0 ? 'shared the lead' : 'led by ' + w.lead} entering Sunday; ${nm(w.winners)} took the week. Sunday: ${pts}</div>`;
  }).join('');
  return `<div class="rcards">${cards}</div><div class="eyebrow" style="margin:16px 4px 2px">Weeks the final day changed the lead</div>${swings || '<div class="swing">None yet.</div>'}
    <p class="note">A showdown is a completed week where two or more players entered Sunday within ${C.range} points of the lead, the most one day can swing. Comeback = won after trailing. Blown lead = led or shared the lead entering Sunday but did not win. Small samples: one showdown per week.</p>`;
};

const tabRec = () => {
  const R = D.records;
  if (!R || !R[P[0].id]) return '<div class="empty">No records yet.</div>';
  const st = (s) => `${s.best}${s.current > 0 ? ` <span class="chip good" style="padding:0 6px">now ${s.current}</span>` : ''}`;
  return '<div class="rcards">' + P.map((p) => {
    const r = R[p.id];
    return `<div class="rc" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="rh">${av(p, 32)}<b>${esc(p.first)}</b></div>
      <div class="kv"><div><b>${r.bestDay.points}</b><small>best day (${md(r.bestDay.date)})</small></div><div><b>${r.perfectDays}</b><small>perfect days</small></div>
      <div><b>${st(r.dailyWinStreak)}</b><small>day-win streak</small></div><div><b>${st(r.gameWinStreak)}</b><small>game-win streak</small></div></div></div>`;
  }).join('') + '</div><p class="note">Perfect day = won every game of a fully recorded day. Streaks end on any non-win or DNP.</p>';
};

const tabSkips = () => {
  const rows = (D.missed || []).slice().sort((a, b) => b.missed - a.missed || BY[a.id].slot - BY[b.id].slot);
  if (!rows.length) return '<div class="empty">No games recorded yet.</div>';
  const max = Math.max(1, ...rows.map((r) => r.missed)), top = rows[0].missed;
  return '<div class="bars">' + rows.map((m) => {
    const p = BY[m.id];
    const chips = (m.missed > 0 && m.missed === top ? '<span class="chip">most skips</span>' : '') + (m.streak >= 2 ? `<span class="chip cold">${I.snow}${m.streak} in a row</span>` : '');
    const by = m.byGame.length ? `<div class="sub-l">${m.byGame.slice().sort((a, b) => b.missed - a.missed).map((g) => esc(g.name) + (g.missed > 1 ? ' ×' + g.missed : '')).join(' ' + MID + ' ')}${m.last ? ' ' + MID + ' last ' + md(m.last) : ''}</div>` : '';
    return `<div data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="frow">${av(p, 32)}<div class="who">${esc(p.first)}<div class="chips">${chips}</div></div><div class="bar"><i style="--w:${Math.round(100 * m.missed / max)}%"></i></div><div class="n">${m.missed}</div></div>${by}</div>`;
  }).join('') + `</div><p class="note">Games skipped while someone else played, all-time (${rows[0].held} games held).</p>`;
};

const tabModel = () => {
  const F = D.forecast && D.forecast.model ? D.forecast : (D.seasonForecast && D.seasonForecast.model ? D.seasonForecast : null);
  if (!F) return '<div class="empty">Ratings appear once there is enough history to learn from.</div>';
  const R = F.model.ratings, names = {};
  (D.todayGames || []).forEach((g) => { names[g.slug] = g.name; });
  const slugs = Object.keys(R[P[0].id].games);
  const order = sortedBy((a, b) => R[b.id].skill - R[a.id].skill);
  const rows = order.map((p) => {
    const r = R[p.id];
    const tiles = slugs.map((s, i) => {
      const v = r.games[s], d = v - 1500, a = Math.round(Math.min(0.55, Math.abs(d) / 120 * 0.5) * 100);
      const col = d >= 0 ? 'var(--good)' : 'var(--bad)';
      return `<div class="rg" style="--gc:${GC[i % GC.length]};background:var(--track);background:color-mix(in srgb, ${col} ${a}%, transparent)">${gem({ slug: s, name: names[s] || s })}<span>${v}</span></div>`;
    }).join('');
    return `<div class="rate" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="rt">${av(p, 38)}<div class="who"><b>${esc(p.first)}</b><small>shows up ${Math.round(r.attend * 100)}% of days</small></div><div class="big">${r.skill}</div></div><div class="rgames">${tiles}</div></div>`;
  }).join('');
  return rows + `<p class="note">Skill on an Elo-like scale: 1500 is average and 100 points ahead is roughly a 64% chance to finish ahead of someone head to head. The tiles show each player's rating in each game (green above average, red below). Learned from ${F.model.games} head-to-head games over ${F.model.days} days; the same model produces the odds.</p>`;
};

const PANES = { form: tabForm, h2h: tabH2H, games: tabGames, days: tabDays, fin: tabFin, weekly: tabWeekly, clutch: tabClutch, rec: tabRec, model: tabModel, skips: tabSkips };
function showTab(id) {
  TAB = id;
  $$('#seg button').forEach((b) => {
    const on = b.getAttribute('data-t') === id;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); b.setAttribute('tabindex', on ? '0' : '-1');
  });
  const pane = $('#pane');
  pane.setAttribute('role', 'tabpanel'); pane.setAttribute('aria-labelledby', 'tab-' + id);
  pane.className = 'pane' + (id === 'games' ? ' gstats' : '');
  pane.innerHTML = PANES[id]();
  $$('[data-fin]', pane).forEach((b) => b.addEventListener('click', () => { const v = b.getAttribute('data-fin'); FINSEL = v === 'all' ? 'all' : +v; showTab('fin'); }));
  runCounts(pane); applyFocus();
}
function renderStats() {
  $('#stats').innerHTML = `${sectionHead('Stats', 'all-time unless noted')}<div class="card rv"><div class="seg" id="seg" role="tablist">${TABS.map((t) => `<button type="button" role="tab" id="tab-${t[0]}" aria-controls="pane" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="pane"></div></div>`;
  $$('#seg button').forEach((b) => b.addEventListener('click', () => showTab(b.getAttribute('data-t'))));
  $('#seg').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    const ids = TABS.map((t) => t[0]), j = (ids.indexOf(TAB) + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length;
    showTab(ids[j]); $('#tab-' + ids[j]).focus();
  });
  showTab(TAB); watch($('#stats'));
}

/* ---- history ---- */
function renderHistory() {
  const weeks = (D.weeks || []).slice().reverse();
  const wRows = weeks.map((w, i) => `<tr><td>Wk ${weeks.length - i} ${MID} ${esc(w.label)}${w.complete ? '' : ' (live)'}${(w.missed || []).length ? ` ⚠${w.missed.length}` : ''}</td>` +
    P.map((p) => `<td class="${w.complete && w.winners.indexOf(p.id) >= 0 ? 'w' : ''}" style="${pv(p)}">${w.totals[p.id] || 0}</td>`).join('') + '</tr>').join('');
  const missed = {}; (D.missedDays || []).forEach((d) => { missed[d] = true; });
  let days = Object.keys(D.dayTotals).concat(D.missedDays || []);
  days = days.filter((d, i) => days.indexOf(d) === i).sort().reverse();
  const dRows = days.map((d) => {
    if (missed[d]) return `<tr class="miss"><td>${md(d)}</td><td colspan="${P.length}" style="text-align:left">no data ${EMD} day missed</td></tr>`;
    const t = D.dayTotals[d], best = Math.max.apply(null, P.map((p) => t[p.id] || 0));
    return `<tr><td>${longDate(d)}</td>` + P.map((p) => `<td class="${(t[p.id] || 0) === best && best > 0 ? 'w' : ''}" style="${pv(p)}">${t[p.id] || 0}</td>`).join('') + '</tr>';
  }).join('');
  const head = '<tr><th>' + EMD + '</th>' + P.map((p) => `<th>${esc(p.first)}</th>`).join('') + '</tr>';
  $('#history').innerHTML = `${sectionHead('History', 'every week and day')}
    <details class="fold rv"><summary>Weekly history</summary><div class="tbw"><table class="tbl">${head}${wRows}</table></div></details>
    <details class="fold rv"><summary>Daily history</summary><div class="tbw"><table class="tbl">${head}${dRows}</table></div></details>`;
  watch($('#history'));
}

/* ---------- chrome: theme toggle, scrollspy ----------------------------------- */
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { const t = localStorage.getItem('pl-theme'); if (THEMES.indexOf(t) >= 0) theme = t; } catch (e) { /* storage blocked: stay on auto */ }
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
  $('#themebtn').innerHTML = I[theme === 'light' ? 'sun' : theme === 'dark' ? 'moon' : 'auto'];
  $('#themebtn').setAttribute('title', 'Theme: ' + theme);
}
$('#themebtn').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem('pl-theme', theme); } catch (e) { /* ignore */ }
  applyTheme();
});
function spy() {
  const links = {}; $$('#nav a').forEach((a) => { links[a.getAttribute('data-sec')] = a; });
  if (!('IntersectionObserver' in window)) return;
  const o = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    Object.keys(links).forEach((k) => links[k].classList.toggle('on', k === e.target.id));
    const a = links[e.target.id]; if (a && a.scrollIntoView) { const nav = $('#nav'); nav.scrollTo({ left: a.offsetLeft - 16, behavior: REDUCE ? 'auto' : 'smooth' }); }
  }), { rootMargin: '-30% 0px -60% 0px' });
  Object.keys(links).forEach((k) => { const s = document.getElementById(k); if (s) o.observe(s); });
}

/* ---------- go ------------------------------------------------------------------ */
applyTheme();
renderHeader(); renderAlert(); renderRace(); renderToday(); renderOdds(); renderWhatIf(); renderPreview(); renderChartSection();
renderFame(); renderStats(); renderHistory();
applyFocus(); spy();
})();
