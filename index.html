<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Puzzle League</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Cpath d='M20 14h24v10c0 9-5 15-12 17-7-2-12-8-12-17z' fill='%23ffd166'/%3E%3Crect x='26' y='44' width='12' height='5' rx='2' fill='%23ffd166'/%3E%3Crect x='20' y='49' width='24' height='5' rx='2.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ---------- tokens ---------------------------------------------------------- */
:root {
  color-scheme: light;
  --bg: #f1f2fa; --solid: #ffffff; --surface: rgba(255,255,255,.78);
  --ink: #13151f; --ink2: #454a5f; --muted: #868ba2;
  --line: rgba(26,32,70,.09); --line2: rgba(26,32,70,.18);
  --track: rgba(26,32,70,.07); --bar: rgba(243,244,252,.76);
  --shadow: 0 22px 44px -26px rgba(38,48,120,.45), 0 2px 8px rgba(38,48,120,.07);
  --gold: #f0ad1b; --silver: #a9b2c6; --bronze: #c8844d; --slate: #66709a;
  --good: #13a678; --bad: #e5484d;
  --blob: .30;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable Display",
          "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 26px; --r2: 18px; --r3: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0b13; --solid: #171a29; --surface: rgba(26,29,46,.70);
    --ink: #f1f2f9; --ink2: #b6bad0; --muted: #7b8098;
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.17);
    --track: rgba(255,255,255,.08); --bar: rgba(10,11,19,.72);
    --shadow: 0 22px 44px -24px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.3);
    --blob: .26;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0b13; --solid: #171a29; --surface: rgba(26,29,46,.70);
  --ink: #f1f2f9; --ink2: #b6bad0; --muted: #7b8098;
  --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.17);
  --track: rgba(255,255,255,.08); --bar: rgba(10,11,19,.72);
  --shadow: 0 22px 44px -24px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.3);
  --blob: .26;
}

/* ---------- base ------------------------------------------------------------ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
b, strong { font-weight: 700; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 4px 16px 90px; }

/* animated colour mesh behind everything, tinted by the players' colours */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
.bg i {
  position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%;
  filter: blur(80px); opacity: var(--blob); will-change: transform;
  animation: drift 26s ease-in-out infinite alternate;
}
.bg i:nth-child(1) { background: var(--p0); left: -22vmax; top: -26vmax; }
.bg i:nth-child(2) { background: var(--p1); right: -26vmax; top: -10vmax; animation-delay: -6s; animation-duration: 31s; }
.bg i:nth-child(3) { background: var(--p2); left: -10vmax; bottom: -34vmax; animation-delay: -12s; animation-duration: 34s; }
.bg i:nth-child(4) { background: var(--p3); right: -20vmax; bottom: -28vmax; animation-delay: -3s; animation-duration: 29s; }
@keyframes drift {
  from { transform: translate3d(0,0,0) scale(1); }
  to   { transform: translate3d(6vmax,4vmax,0) scale(1.12); }
}

/* ---------- top bar + nav --------------------------------------------------- */
.top {
  position: sticky; top: 0; z-index: 60;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(1.5) blur(18px); backdrop-filter: saturate(1.5) blur(18px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px 6px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.02em; font-size: 1.08rem; }
.logo {
  width: 30px; height: 30px; border-radius: 10px; flex: none; position: relative;
  background: linear-gradient(135deg, var(--p0), var(--p1) 55%, var(--p3));
  box-shadow: 0 6px 14px -6px var(--p1);
}
.logo::after {
  content: ""; position: absolute; inset: 7px 8px 8px; border-radius: 3px 3px 9px 9px;
  background: rgba(255,255,255,.92);
  clip-path: polygon(0 0,100% 0,88% 55%,62% 80%,62% 100%,38% 100%,38% 80%,12% 55%);
}
.pill {
  margin-left: auto; font-size: .76rem; font-weight: 700; color: var(--ink2);
  padding: 5px 11px; border-radius: 999px; background: var(--track); white-space: nowrap;
}
.iconbtn {
  width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none;
  transition: transform .2s, background .2s;
}
.iconbtn:hover { transform: rotate(-12deg) scale(1.06); }
.iconbtn svg { width: 18px; height: 18px; }
.nav {
  max-width: 1120px; margin: 0 auto; padding: 2px 16px 10px; display: flex; gap: 6px;
  overflow-x: auto; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  flex: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: .86rem;
  color: var(--ink2); transition: background .25s, color .25s, transform .25s;
}
.nav a:hover { background: var(--track); }
.nav a.on { background: var(--ink); color: var(--bg); }

/* ---------- layout primitives ----------------------------------------------- */
.sec { scroll-margin-top: 112px; margin-top: 26px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 12px; flex-wrap: wrap; }
.sec-h h2 { margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: -.03em; }
.sec-h .sub { color: var(--muted); font-size: .85rem; font-weight: 600; }
.eyebrow { font-size: .7rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
.card {
  position: relative; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 18px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.grid2 { display: grid; gap: 14px; }
@media (min-width: 860px) {
  .grid2 { grid-template-columns: 1fr 1fr; }
  .card { padding: 24px; }
}
.note { color: var(--muted); font-size: .76rem; line-height: 1.5; margin: 12px 2px 0; }
.empty { color: var(--muted); text-align: center; padding: 22px 8px; font-weight: 600; }
.grad {
  background: linear-gradient(120deg, var(--p0), var(--p1), var(--p3)); -webkit-background-clip: text;
  background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}

/* scroll-reveal */
.rv { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.rv.in { opacity: 1; transform: none; }

/* spotlight: tapping a player dims everyone else */
[data-p] { transition: opacity .3s, filter .3s; }
[data-p].dim { opacity: .28; filter: saturate(.4); }
[data-fb] { cursor: pointer; }

/* ---------- avatars, chips --------------------------------------------------- */
.av {
  width: var(--s, 34px); height: var(--s, 34px); border-radius: 50%; flex: none;
  display: inline-grid; place-items: center; font-weight: 800; letter-spacing: -.02em;
  font-size: calc(var(--s, 34px) * .44); color: var(--pc-ink); background: var(--pc);
  box-shadow: inset 0 -7px 12px rgba(0,0,0,.13), inset 0 2px 3px rgba(255,255,255,.35), 0 6px 14px -6px var(--pc);
}
.av.two { font-size: calc(var(--s, 34px) * .36); letter-spacing: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  font-size: .72rem; font-weight: 800; background: var(--track); color: var(--ink2); white-space: nowrap;
}
.chip svg { width: 12px; height: 12px; }
.chip.gold { background: rgba(240,173,27,.18); color: #b97d00; }
.chip.hot { background: rgba(229,72,77,.14); color: var(--bad); }
.chip.cold { background: rgba(70,150,255,.16); color: #2f7ae5; }
.chip.good { background: rgba(19,166,120,.15); color: var(--good); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.gold { color: #f7c755; } }
:root[data-theme="dark"] .chip.gold { color: #f7c755; }
.mv { display: inline-flex; align-items: center; gap: 2px; font-size: .72rem; font-weight: 800; }
.mv.up { color: var(--good); } .mv.down { color: var(--bad); } .mv.flat { color: var(--muted); }
.mv::before { content: ""; border: 4px solid transparent; }
.mv.up::before { border-bottom: 6px solid currentColor; border-top: 0; }
.mv.down::before { border-top: 6px solid currentColor; border-bottom: 0; }
.mv.flat::before { width: 7px; height: 2px; border: 0; background: currentColor; border-radius: 2px; }

/* ---------- alert ------------------------------------------------------------ */
.alert {
  margin-top: 16px; padding: 14px 18px; border-radius: var(--r2); color: #fff; text-align: center;
  background: linear-gradient(120deg, #e5484d, #ff7a59); box-shadow: 0 14px 34px -14px #e5484d;
  animation: pulse 1.8s ease-in-out infinite;
}
.alert b { display: block; font-size: 1.15rem; letter-spacing: .01em; }
.alert small { opacity: .9; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .68rem; }
@keyframes pulse { 50% { box-shadow: 0 14px 44px -6px #e5484d; transform: scale(1.012); } }

/* ---------- hero / podium ---------------------------------------------------- */
.hero-top { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
.hero h1 { margin: 6px 0 4px; font-size: clamp(1.7rem, 6.4vw, 2.7rem); line-height: 1.05; letter-spacing: -.045em; font-weight: 800; }
.hero .lead { color: var(--ink2); font-weight: 600; font-size: .92rem; }
.ring { position: relative; flex: none; width: 92px; height: 92px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--track); }
.ring .arc { stroke-linecap: round; stroke-dasharray: var(--c) var(--c); stroke-dashoffset: var(--c); transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1) .2s; }
.in .ring .arc, .ring.in .arc { stroke-dashoffset: var(--o); }
.ring .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring .mid b { font-size: 1.35rem; letter-spacing: -.04em; }
.ring .mid small { display: block; color: var(--muted); font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }

.podium { display: flex; align-items: flex-end; justify-content: center; gap: clamp(6px, 2.4vw, 18px); margin-top: 22px; padding-top: 28px; }
.pod { flex: 1 1 0; max-width: 150px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
.pod[data-rank="1"] { order: 2; } .pod[data-rank="2"] { order: 1; }
.pod[data-rank="3"] { order: 3; } .pod[data-rank="4"] { order: 4; }
.pod .crown { position: absolute; top: -26px; width: 30px; height: 30px; color: var(--gold); filter: drop-shadow(0 4px 6px rgba(240,173,27,.45)); animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg); } }
.pod .nm { margin-top: 8px; font-weight: 800; font-size: .95rem; letter-spacing: -.02em; }
.pod .pts { font-size: 1.55rem; font-weight: 800; letter-spacing: -.045em; line-height: 1.1; }
.pod .gap { color: var(--muted); font-size: .72rem; font-weight: 700; min-height: 1.1em; }
.pillar {
  width: 100%; margin-top: 10px; height: 0; border-radius: 18px 18px 8px 8px; position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--pc), var(--pc-m)); transition: height 1.1s cubic-bezier(.2,.9,.25,1.15) .15s;
  box-shadow: 0 16px 30px -18px var(--pc);
}
.in .pillar, .pillar.in { height: var(--ph); }
.pillar::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 40%; background: linear-gradient(180deg, rgba(255,255,255,.35), transparent); }
.pillar .rk { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 2rem; font-weight: 800; color: #fff; opacity: .85; text-shadow: 0 2px 10px rgba(0,0,0,.18); }
.pod .mv { margin-top: 2px; }
@media (min-width: 900px) {
  .hero { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.25fr); gap: 28px; align-items: center; }
  .hero-top { flex-direction: column; align-items: flex-start; gap: 22px; }
  .hero .podium { margin-top: 0; padding-top: 34px; }
  .ring { width: 112px; height: 112px; }
}

/* ---------- today ------------------------------------------------------------ */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.tile { padding: 12px 6px; text-align: center; border-radius: var(--r2); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.tile.top1 { border-color: var(--pc); box-shadow: 0 14px 30px -16px var(--pc); }
.tile .av { margin: 0 auto 6px; }
.tile .v { font-size: 1.5rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.tile small { display: block; margin-top: 3px; color: var(--muted); font-weight: 700; font-size: .7rem; }
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; margin: 0 -2px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.gcard { flex: 0 0 82%; max-width: 310px; scroll-snap-align: start; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
@media (min-width: 900px) {
  .rail { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; }
  .gcard { max-width: none; }
}
.gh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.gem { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: .95rem; background: var(--gc); box-shadow: 0 8px 16px -8px var(--gc); }
.gh b { font-size: 1.02rem; letter-spacing: -.02em; }
.grow { display: flex; align-items: center; gap: 9px; padding: 7px 4px; border-radius: 12px; }
.grow + .grow { border-top: 1px dashed var(--line); }
.plc { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .76rem; flex: none; background: var(--track); color: var(--ink2); }
.plc.p1 { background: var(--gold); color: #5b3b00; } .plc.p2 { background: var(--silver); color: #2b3347; } .plc.p3 { background: var(--bronze); color: #3d2208; }
.grow .nm { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .sc { font-weight: 700; color: var(--ink2); font-size: .94rem; }
.grow .pt { min-width: 34px; text-align: center; font-size: .74rem; font-weight: 800; padding: 3px 7px; border-radius: 999px; background: var(--pc-s); color: var(--ink); }
.grow.dnp { opacity: .5; } .grow.dnp .sc { font-weight: 600; font-size: .8rem; }
.gcard .nodata { color: var(--muted); padding: 18px 4px; text-align: center; font-weight: 700; }

/* ---------- odds ------------------------------------------------------------- */
.odds-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.odds-h h3 { margin: 0; font-size: 1.12rem; font-weight: 800; letter-spacing: -.03em; }
.odds-h span { color: var(--muted); font-size: .78rem; font-weight: 700; }
.orow { padding: 12px 0; }
.orow + .orow { border-top: 1px dashed var(--line); }
.oh { display: flex; align-items: center; gap: 10px; }
.oh .who { flex: 1; min-width: 0; line-height: 1.2; }
.oh .who b { display: block; font-size: 1rem; letter-spacing: -.02em; }
.oh .who small { color: var(--muted); font-weight: 700; font-size: .74rem; }
.oh .win { text-align: right; line-height: 1; }
.oh .win b { font-size: 1.7rem; font-weight: 800; letter-spacing: -.05em; }
.oh .win small { display: block; margin-top: 2px; color: var(--muted); font-weight: 800; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; }
.obar { display: flex; height: 12px; margin: 10px 0 7px; border-radius: 999px; overflow: hidden; background: var(--track); gap: 2px; }
.obar i { display: block; flex: var(--f) 1 0; min-width: 0; background: var(--pc); border-radius: 3px; transform: scaleX(0); transform-origin: left; transition: transform .9s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--d, 0ms) + var(--k) * 90ms); }
.obar i:first-child { border-radius: 999px 3px 3px 999px; } .obar i:last-child { border-radius: 3px 999px 999px 3px; }
.obar i:nth-child(1) { background: var(--gold); }
.obar i:nth-child(2) { background: var(--silver); }
.obar i:nth-child(3) { background: var(--bronze); }
.obar i:nth-child(4) { background: var(--slate); }
.oplaces span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--slate); }
.oplaces span:nth-child(1)::before { background: var(--gold); }
.oplaces span:nth-child(2)::before { background: var(--silver); }
.oplaces span:nth-child(3)::before { background: var(--bronze); }
.plegend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 6px 0; color: var(--muted); font-size: .76rem; font-weight: 700; }
.plegend span { display: inline-flex; align-items: center; gap: 6px; }
.plegend i { width: 14px; height: 8px; border-radius: 4px; }
.plegend .k1 { background: var(--gold); } .plegend .k2 { background: var(--silver); }
.plegend .k3 { background: var(--bronze); } .plegend .k4 { background: var(--slate); }
.in .obar i, .obar.in i { transform: scaleX(1); }
.oplaces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.oplaces span { text-align: center; font-size: .68rem; color: var(--muted); font-weight: 700; }
.oplaces b { display: block; color: var(--ink); font-size: .84rem; }
details.how { margin-top: 12px; }
details.how summary { cursor: pointer; font-weight: 800; font-size: .78rem; color: var(--ink2); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::before { content: "+"; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--track); font-size: .85rem; }
details.how[open] summary::before { content: "\2212"; }

/* ---------- week lanes ------------------------------------------------------- */
.lane { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.lane .trk { flex: 1; height: 14px; border-radius: 999px; background: var(--track); overflow: hidden; }
.lane .trk i { display: block; height: 100%; width: var(--w); border-radius: 999px; background: linear-gradient(90deg, var(--pc-m), var(--pc)); transform: scaleX(0); transform-origin: left; transition: transform 1.1s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.in .lane .trk i, .lane.in .trk i { transform: scaleX(1); }
.lane .nm { width: 64px; font-weight: 700; font-size: .92rem; }
.lane .v { width: 40px; text-align: right; font-weight: 800; letter-spacing: -.03em; }

/* ---------- chart ------------------------------------------------------------ */
.chartbox { position: relative; touch-action: pan-y; }
.chartbox svg { display: block; width: 100%; overflow: visible; }
.chartbox .gridl { stroke: var(--line); stroke-width: 1; }
.chartbox .axis { fill: var(--muted); font-size: 10.5px; font-weight: 700; }
.chartbox .ln { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chartbox .xh { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 3 4; }
.tip {
  position: absolute; top: 6px; left: 0; pointer-events: none; min-width: 150px; z-index: 5;
  background: var(--solid); border: 1px solid var(--line2); border-radius: 14px; padding: 9px 11px;
  box-shadow: var(--shadow); font-size: .78rem; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s;
}
.tip.on { opacity: 1; transform: none; }
.tip .d { color: var(--muted); font-weight: 800; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; }
.tip .r { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; font-weight: 700; }
.tip .r i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); flex: none; }
.tip .r em { margin-left: auto; font-style: normal; font-weight: 800; }
.tip .r small { color: var(--muted); font-weight: 700; min-width: 30px; text-align: right; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.lg { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: .82rem; cursor: pointer; transition: opacity .2s, transform .2s; }
.lg i { width: 11px; height: 11px; border-radius: 50%; background: var(--pc); }
.lg:hover { transform: translateY(-1px); }

0, "places": [1.0, 0.0, 0.0, 0.0], "expected": 147.3}, "andrew": {"now": 105, "margin": -21, "win": 0.0, "places": [0.0, 0.8145, 0.1855, 0.0], "expected": 122.2}, "mitch": {"now": 83, "margin": -43, "win": 0.0, "places": [0.0, 0.0, 0.0113, 0.9887], "expected": 96.6}, "kyle": {"now": 102, "margin": -24, "win": 0.0, "places": [0.0, 0.1855, 0.8032, 0.0113], "expected": 117.1}}, "week": {"start": "2026-10-05", "end": "2026-10-11", "label": "Oct 5 – Oct 11"}}, "seasonForecast": {"daysLeft": 36, "todayCounted": false, "pool": 75, "sims": 8000, "halfLife": 28, "players": {"matt": {"now": 426, "margin": 56, "win": 1.0, "places": [1.0, 0.0, 0.0, 0.0], "expected": 1191.8}, "andrew": {"now": 370, "margin": -56, "win": 0.0, "places": [0.0, 0.9984, 0.0016, 0.0], "expected": 986.9}, "mitch": {"now": 271, "margin": -155, "win": 0.0, "places": [0.0, 0.0, 0.052, 0.948], "expected": 763.1}, "kyle": {"now": 300, "margin": -126, "win": 0.0, "places": [0.0, 0.0016, 0.9464, 0.052], "expected": 841.6}}, "season": {"n": 2, "label": "Season 2", "range": "Sep 21 – Nov 15, 2026", "weeks": 8, "weekIndex": 3, "weeksLeft": 6}}};</script>
<script>
(() => {
'use strict';

/* ======================================================================
   Puzzle League dashboard (modern design). Everything renders from the
   payload embedded as window.PL; there are no network requests.
   ====================================================================== */
const D = window.PL;
const P = D.players;
const BY = {};
P.forEach((p) => { BY[p.id] = p; });
const MID = '·', DASH = '–', EMD = '—', MINUS = '−';
const ORD = ['1st', '2nd', '3rd', '4th'];
const REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- small helpers ------------------------------------------------ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pv = (p) => `--pc:var(--p${p.slot});--pc-s:var(--p${p.slot}-s);--pc-m:var(--p${p.slot}-m);--pc-ink:var(--p${p.slot}-ink)`;
const letters = (p) => p.first.replace(/[^A-Za-z]/g, '') || p.first;
const firstCount = {};
P.forEach((p) => { const k = letters(p).charAt(0).toUpperCase(); firstCount[k] = (firstCount[k] || 0) + 1; });
const initial = (p) => { const l = letters(p), k = l.charAt(0).toUpperCase(); return firstCount[k] > 1 ? k + l.charAt(1).toLowerCase() : k; };
const av = (p, size) => { const t = initial(p); return `<span class="av${t.length > 1 ? ' two' : ''}" style="${pv(p)};--s:${size || 34}px">${esc(t)}</span>`; };
const md = (s) => (s ? `${parseInt(s.slice(5, 7), 10)}/${parseInt(s.slice(8, 10), 10)}` : EMD);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOWS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const longDate = (s) => { const d = new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); return `${DOWS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const fcPct = (p) => (p <= 0 ? '0%' : p < 0.005 ? '<1%' : p > 0.995 ? '>99%' : `${Math.round(p * 100)}%`);
const sortedBy = (fn) => P.slice().sort(fn);

const I = {
  crown: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 4.5 16.5 12 21 8l-2 11H5L3 8z"/><rect x="5" y="20" width="14" height="2" rx="1"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v5a5 5 0 0 1-10 0V3z"/><path d="M5 5H3v2a4 4 0 0 0 3.5 3.96V9A2 2 0 0 1 5 7V5zm14 0v2a2 2 0 0 1-1.5 2v1.96A4 4 0 0 0 21 7V5h-2z"/><rect x="11" y="13" width="2" height="4"/><rect x="8" y="18" width="8" height="2.5" rx="1"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 2 2 0-3-1-5 1-8z"/></svg>',
  snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M3.5 7l17 10M3.5 17l17-10"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
};

/* ---------- per-theme player colours -------------------------------------- */
(() => {
  const rgb = (h) => { const x = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(x.substr(i, 2), 16)); };
  const lum = (h) => { const c = rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const block = (cols) => P.map((p) => {
    const h = cols[p.slot], c = rgb(h).join(',');
    return `--p${p.slot}:${h};--p${p.slot}-s:rgba(${c},.16);--p${p.slot}-m:rgba(${c},.42);--p${p.slot}-ink:${lum(h) > 0.42 ? '#16171e' : '#fff'};`;
  }).join('');
  const st = document.createElement('style');
  st.textContent = `:root{${block(D.colorsLight)}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${block(D.colorsDark)}}}:root[data-theme="dark"]{${block(D.colorsDark)}}`;
  document.head.appendChild(st);
})();

/* ---------- motion: reveal on scroll, count-up --------------------------- */
const countUp = (n) => {
  if (n._done) return; n._done = true;
  const to = parseFloat(n.getAttribute('data-count')), dec = +n.getAttribute('data-dec') || 0;
  const pre = n.getAttribute('data-pre') || '', suf = n.getAttribute('data-suf') || '';
  const fmt = (v) => pre + v.toFixed(dec) + suf;
  if (REDUCE || !isFinite(to)) { n.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 1100;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    n.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
};
const runCounts = (root) => { $$('[data-count]', root).forEach(countUp); if (root.matches && root.matches('[data-count]')) countUp(root); };
const io = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); runCounts(e.target); io.unobserve(e.target); } });
}, { threshold: 0.1, rootMargin: '0px 0px -5% 0px' }) : null;
const watch = (root) => {
  $$('.rv', root).forEach((n) => { if (!io || REDUCE) { n.classList.add('in'); runCounts(n); } else io.observe(n); });
  if (root.classList && root.classList.contains('pane')) runCounts(root);
};

/* ---------- spotlight: tap a player to highlight them everywhere ---------- */
let FOCUS = null;
const applyFocus = () => $$('[data-p]').forEach((n) => n.classList.toggle('dim', !!FOCUS && n.getAttribute('data-p') !== FOCUS));
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-fb]');
  if (!t) return;
  FOCUS = FOCUS === t.getAttribute('data-fb') ? null : t.getAttribute('data-fb');
  applyFocus(); drawChart();
});

/* ======================================================================
   Sections
   ====================================================================== */
const sectionHead = (title, sub) => `<div class="sec-h rv"><h2>${title}</h2>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;

/* ---- header + alert ---- */
function renderHeader() {
  const w = D.seasonNow;
  $('#seasonpill').textContent = w ? `${w.label} ${MID} Wk ${w.week_index}/${w.weeks}` : 'Puzzle League';
  $('#foot').textContent = `Updated ${D.generated}`;
}
function renderAlert() {
  const sp = P.filter((p) => p.special)[0];
  const box = $('#alert');
  if (!sp || !D.standings.length) { box.innerHTML = ''; return; }
  const top = Math.max.apply(null, D.standings.map((s) => s.points));
  const me = D.standings.filter((s) => s.player === sp.id)[0];
  if (!me || top <= 0 || me.points < top) { box.innerHTML = ''; return; }
  const last = sp.name.split(' ').slice(-1)[0].toUpperCase();
  box.innerHTML = `<div class="alert"><small>emergency broadcast</small><b>${esc(last)} IS IN FIRST PLACE.</b><small>remain calm</small></div>`;
}

/* ---- race hero ---- */
const rankAt = (i) => {
  const order = D.standings.map((s) => s.player);
  const arr = P.map((p) => ({ id: p.id, v: D.series.cumulative[p.id][i] }));
  arr.sort((a, b) => b.v - a.v || order.indexOf(a.id) - order.indexOf(b.id));
  const r = {}; arr.forEach((a, k) => { r[a.id] = k + 1; });
  return r;
};
function renderRace() {
  const st = D.standings, w = D.seasonNow;
  if (!st.length) { $('#race').innerHTML = ''; return; }
  const lead = st[0], run = st[1], lp = BY[lead.player], rp = run ? BY[run.player] : null;
  const gap = run ? lead.points - run.points : 0;
  let head, lede;
  if (!lead.points) { head = 'A <span class="grad">fresh</span> season'; lede = 'Everyone starts at zero. Play on.'; }
  else if (gap === 0) { head = `${esc(lp.first)} &amp; ${esc(rp.first)} are <span class="grad">level</span>`; lede = 'A dead heat at the top.'; }
  else { head = `${esc(lp.first)} leads by <span class="grad">${gap}</span>`; lede = `${esc(rp.first)} is the closest chaser.`; }
  const left = w ? (w.days_left === 0 ? 'Final day' : `${w.days_left} day${w.days_left === 1 ? '' : 's'} left`) : '';
  const frac = w ? Math.min(1, Math.max(0, (w.weeks * 7 - w.days_left) / (w.weeks * 7))) : 0;
  const C = 2 * Math.PI * 40;
  const ring = w ? `<div class="ring" style="--c:${C.toFixed(1)};--o:${(C * (1 - frac)).toFixed(1)}">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--p0)"/><stop offset="1" style="stop-color:var(--p3)"/></linearGradient></defs>
      <circle class="trk" cx="50" cy="50" r="40" fill="none" stroke-width="9"/><circle class="arc" cx="50" cy="50" r="40" fill="none" stroke="url(#rg)" stroke-width="9"/></svg>
      <div class="mid"><div><b>${w.week_index}</b><small>of ${w.weeks} wks</small></div></div></div>` : '';
  const n = D.series.days.length;
  const now = n ? rankAt(n - 1) : null, prev = n > 1 ? rankAt(n - 2) : null;
  const max = Math.max(1, ...st.map((s) => s.points));
  const pods = st.map((s, i) => {
    const p = BY[s.player], rank = i + 1, ph = 46 + Math.round(124 * (s.points / max));
    const d = prev ? prev[p.id] - now[p.id] : 0;
    const mv = prev && d ? `<span class="mv ${d > 0 ? 'up' : 'down'}">${Math.abs(d)}</span>` : '';
    return `<div class="pod" data-rank="${rank}" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)};--ph:${ph}px">
      ${rank === 1 && s.points > 0 ? `<span class="crown">${I.crown}</span>` : ''}
      ${av(p, 54)}<div class="nm">${esc(p.first)}</div>
      <div class="pts" data-count="${s.points}">0</div>
      <div class="gap">${rank === 1 ? (s.points ? 'leader' : '') : MINUS + (lead.points - s.points)}</div>${mv}
      <div class="pillar"><span class="rk">${rank}</span></div></div>`;
  }).join('');
  $('#race').innerHTML = `<div class="card hero rv">
    <div class="hero-top"><div><div class="eyebrow">${w ? esc(w.label) + ' ' + MID + ' ' + esc(w.range) : 'Season standings'}</div>
      <h1>${head}</h1><div class="lead">${lede}${left ? ' ' + MID + ' ' + left : ''}</div></div>${ring}</div>
    <div class="podium">${pods}</div></div>`;
  watch($('#race'));
}

/* ---- today ---- */
const GC = ['#7c5cff', '#14b8a6', '#f59e0b', '#ef4444', '#06b6d4', '#84cc16', '#ec4899'];
function renderToday() {
  const tt = D.todayTotals, order = sortedBy((a, b) => (tt[b.id] || 0) - (tt[a.id] || 0));
  const best = tt[order[0].id] || 0;
  const tiles = order.map((p) => `<div class="tile ${(tt[p.id] || 0) === best && best > 0 ? 'top1' : ''}" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}">
      ${av(p, 38)}<div class="v" data-count="${tt[p.id] || 0}">0</div><small>${esc(p.first)}</small></div>`).join('');
  const rail = D.todayGames.map((g, i) => {
    let rows;
    if (g.status !== 'ok' || !g.rows.length) rows = '<div class="nodata">no results yet</div>';
    else rows = g.rows.map((r) => {
      const p = BY[r.player];
      return r.played
        ? `<div class="grow" data-p="${p.id}" style="${pv(p)}"><span class="plc ${r.rank <= 3 ? 'p' + r.rank : ''}">${r.rank}</span>${av(p, 24)}<span class="nm">${esc(p.first)}</span><span class="sc">${esc(r.score)}</span><span class="pt">+${r.points}</span></div>`
        : `<div class="grow dnp" data-p="${p.id}" style="${pv(p)}"><span class="plc">${EMD}</span>${av(p, 24)}<span class="nm">${esc(p.first)}</span><span class="sc">did not play</span><span class="pt">+0</span></div>`;
    }).join('');
    return `<div class="gcard rv" style="--gc:${GC[i % GC.length]};--d:${i * 70}ms"><div class="gh"><span class="gem">${esc(g.name.charAt(0))}</span><b>${esc(g.name)}</b></div>${rows}</div>`;
  }).join('');
  $('#today').innerHTML = `${sectionHead('Today', longDate(D.day))}
    <div class="tiles rv">${tiles}</div><div class="rail">${rail}</div>${weekCard()}`;
  watch($('#today'));
}

/* ---- this week's standings (live, includes today's partial points) ---- */
function weekCard() {
  const wk = (D.weeks || [])[(D.weeks || []).length - 1];
  if (!wk) return '';
  const order = sortedBy((a, b) => (wk.totals[b.id] || 0) - (wk.totals[a.id] || 0));
  const max = Math.max(1, ...order.map((p) => wk.totals[p.id] || 0));

/* ---- odds ---- */
function oddsCard(F, title, right, how) {
  if (!F) return '';
  const order = sortedBy((a, b) => F.players[b.id].win - F.players[a.id].win || F.players[b.id].now - F.players[a.id].now);
  const rows = order.map((p, i) => {
    const f = F.players[p.id], m = f.margin;
    const win = f.win > 0.005 && f.win < 0.995 ? `<b data-count="${Math.round(f.win * 100)}" data-suf="%">0%</b>` : `<b>${fcPct(f.win)}</b>`;
    const segs = f.places.map((v, k) => `<i style="--f:${Math.max(v, 0.0001)};--k:${k}"></i>`).join('');
    return `<div class="orow rv" data-p="${p.id}" style="${pv(p)};--d:${i * 80}ms">
      <div class="oh">${av(p, 38)}<div class="who"><b>${esc(p.first)}</b><small>${f.now} pts ${MID} ${m > 0 ? '+' + m : m < 0 ? MINUS + Math.abs(m) : 'level'}</small></div>
        <div class="win">${win}<small>to win</small></div></div>
      <div class="obar">${segs}</div>
      <div class="oplaces">${f.places.map((v, k) => `<span>${ORD[k]}<b>${fcPct(v)}</b></span>`).join('')}</div></div>`;
  }).join('');
  return `<div class="card"><div class="odds-h"><h3>${title}</h3><span>${right}</span></div>${rows}
    <details class="how"><summary>How is this calculated?</summary><p class="note">${how}</p></details></div>`;
}
function renderOdds() {
  const wf = D.forecast, sf = D.seasonForecast;
  if (!wf && !sf) { $('#odds').innerHTML = ''; return; }
  const common = (F) => `Each open day is drawn from ${F.pool} real past days, with recent days counting more (the weight halves every ${F.halfLife} days), and added to the totals so far. That is repeated ${F.sims.toLocaleString()} times and the share of times each player lands in each place is the probability. Tied totals split the place. ${F.todayCounted ? 'Today is counted.' : 'Today is not counted until all four players have posted every game.'} It assumes recent form continues, so treat it as a guide, not a guarantee.`;
  const wk = wf ? oddsCard(wf, `This week ${MID} ${esc(wf.week.label)}`, wf.daysLeft === 0 ? 'final' : `${wf.daysLeft} day${wf.daysLeft === 1 ? '' : 's'} left`, common(wf)) : '';
  const se = sf ? oddsCard(sf, `${esc(sf.season.label)} finish`, sf.daysLeft === 0 ? 'final' : `${sf.daysLeft} days left`, common(sf)) : '';
  $('#odds').innerHTML = `${sectionHead('Odds', 'who finishes where')}<div class="grid2">${wk}${se}</div>
    <div class="plegend"><span><i class="k1"></i>1st</span><span><i class="k2"></i>2nd</span><span><i class="k3"></i>3rd</span><span><i class="k4"></i>4th</span><span>each bar splits a player's chances across the four places</span></div>`;
  watch($('#odds'));
}

/* ---- chart ---- */
const CH = { hidden: {}, played: false, geo: null };
const smooth = (pts) => {
  if (pts.length < 2) return `M${pts[0][0]},${pts[0][1]}`;
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2, t = 0.17;
    d += ` C${(p1[0] + (p2[0] - p0[0]) * t).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) * t).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) * t).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) * t).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
};
const niceStep = (max, n) => { const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), r = raw / mag; return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag; };

function renderChartSection() {
  $('#chart').innerHTML = `${sectionHead('Points race', D.seasonNow ? esc(D.seasonNow.label) + ' cumulative' : 'cumulative')}
    <div class="card rv"><div class="legend" id="legend"></div><div class="chartbox" id="chartbox"></div>
    <p class="note">Hover or tap the chart for a day-by-day readout. Tap a name above to hide or show a line.</p></div>`;
  drawLegend(); drawChart(); watch($('#chart'));
  if ('ResizeObserver' in window) {
    let last = 0;
    new ResizeObserver(() => { const w = $('#chartbox') ? $('#chartbox').clientWidth : 0; if (w && Math.abs(w - last) > 1) { last = w; drawChart(); } }).observe($('#chartbox'));
  }
}
function drawLegend() {
  $('#legend').innerHTML = P.map((p) => `<button type="button" class="lg ${CH.hidden[p.id] ? 'off' : ''}" data-p="${p.id}" data-l="${p.id}" style="${pv(p)}"><i></i>${esc(p.first)}</button>`).join('');
  $$('[data-l]').forEach((b) => b.addEventListener('click', () => { CH.hidden[b.getAttribute('data-l')] = !CH.hidden[b.getAttribute('data-l')]; drawLegend(); drawChart(); applyFocus(); }));
}
function drawChart() {
  const box = $('#chartbox'); if (!box) return;
  const S = D.series, days = S.days;
  if (!days.length) { box.innerHTML = '<div class="empty">No days recorded yet.</div>'; return; }
  const W = Math.max(280, Math.floor(box.clientWidth) || 340), H = W < 560 ? 260 : 330;
  const m = { l: 36, r: 18, t: 16, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vis = P.filter((p) => !CH.hidden[p.id]);
  let maxY = 1; vis.forEach((p) => S.cumulative[p.id].forEach((v) => { if (v > maxY) maxY = v; }));
  const step = niceStep(maxY, 4), top = Math.ceil(maxY / step) * step || step;
  const x = (i) => m.l + (days.length === 1 ? iw / 2 : (i * iw) / (days.length - 1));
  const y = (v) => m.t + ih - (v / top) * ih;
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="gridl" x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${m.l - 8}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v}</text>`;
  const nX = Math.min(days.length, W < 560 ? 4 : 7);
  for (let k = 0; k < nX; k++) { const idx = nX === 1 ? 0 : Math.round((k * (days.length - 1)) / (nX - 1)); g += `<text class="axis" x="${x(idx).toFixed(1)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === nX - 1 ? 'end' : 'middle'}">${md(days[idx])}</text>`; }
  const leadId = FOCUS && !CH.hidden[FOCUS] ? FOCUS : (D.standings[0] && !CH.hidden[D.standings[0].player] ? D.standings[0].player : null);
  let area = '', lines = '', dots = '';
  vis.forEach((p) => {
    const pts = S.cumulative[p.id].map((v, i) => [x(i), y(v)]);
    const d = smooth(pts);
    if (p.id === leadId && pts.length > 1) area = `<path d="${d} L${pts[pts.length - 1][0].toFixed(1)},${y(0)} L${pts[0][0].toFixed(1)},${y(0)} Z" style="fill:url(#cf);" data-p="${p.id}"/>`;
    lines += `<path class="ln" data-p="${p.id}" style="stroke:var(--p${p.slot})" d="${d}"/>`;
    const last = pts[pts.length - 1];
    dots += `<circle data-p="${p.id}" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" style="fill:var(--p${p.slot});stroke:var(--solid)" stroke-width="2.5"/>`;
  });
  const lc = leadId ? `var(--p${BY[leadId].slot})` : 'var(--p0)';
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Cumulative points by day">
    <defs><linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${lc};stop-opacity:.34"/><stop offset="1" style="stop-color:${lc};stop-opacity:0"/></linearGradient></defs>
    ${g}${area}${lines}<line class="xh" id="xh" y1="${m.t}" y2="${H - m.b}" x1="0" x2="0" style="opacity:0"/>${dots}<g id="hd"></g>
    <rect id="hit" x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tip" id="tip"></div>`;
  CH.geo = { x, y, W, H, m, days, vis };
  applyFocus();
  // draw-on animation the first time the chart scrolls into view
  if (!CH.played && !REDUCE) {
    $$('.ln', box).forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
    const play = () => { CH.played = true; $$('.ln', box).forEach((p, i) => { p.getBoundingClientRect(); p.style.transition = `stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1) ${i * 120}ms`; p.style.strokeDashoffset = 0; }); };
    if ('IntersectionObserver' in window) { const o = new IntersectionObserver((es) => { if (es[0].isIntersecting) { play(); o.disconnect(); } }, { threshold: 0.3 }); o.observe(box); } else play();
  }
  wireHover(box);
}
function wireHover(box) {
  const hit = $('#hit', box), tip = $('#tip', box), xh = $('#xh', box), hd = $('#hd', box), G = CH.geo;
  const show = (e) => {
    const r = box.getBoundingClientRect(), px = e.clientX - r.left;
    let i = G.days.length === 1 ? 0 : Math.round(((px - G.m.l) / (G.W - G.m.l - G.m.r)) * (G.days.length - 1));
    i = Math.max(0, Math.min(G.days.length - 1, i));
    const day = G.days[i], cx = G.x(i);
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.style.opacity = 1;
    const rows = G.vis.slice().sort((a, b) => D.series.cumulative[b.id][i] - D.series.cumulative[a.id][i]);
    hd.innerHTML = rows.map((p) => `<circle cx="${cx}" cy="${G.y(D.series.cumulative[p.id][i])}" r="5.5" style="fill:var(--p${p.slot});stroke:var(--solid)" stroke-width="2.5"/>`).join('');
    tip.innerHTML = `<div class="d">${longDate(day)}</div>` + rows.map((p) => {
      const dt = (D.dayTotals[day] || {})[p.id];
      return `<div class="r" style="${pv(p)}"><i></i>${esc(p.first)}<small>${dt === undefined ? '' : '+' + dt}</small><em>${D.series.cumulative[p.id][i]}</em></div>`;
    }).join('');
    tip.classList.add('on');
    const tw = tip.offsetWidth; let left = cx + 14; if (left + tw > G.W) left = cx - tw - 14; tip.style.left = Math.max(0, left) + 'px';
  };
  const hide = () => { tip.classList.remove('on'); xh.style.opacity = 0; hd.innerHTML = ''; };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hide(); });
  document.addEventListener('pointerdown', (e) => { if (!box.contains(e.target)) hide(); });
}

  return order.map((p) => {
    const t = W.total[p.id];
    const dots = W.weeks.map((w) => `<span class="dot ${w.places[p.id] <= 3 ? 'p' + w.places[p.id] : ''}" title="Wk ${w.n} ${MID} ${w.label}">${w.places[p.id]}</span>`).join('');
    return `<div class="fin" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="fh">${av(p, 30)}<b>${esc(p.first)}</b><small>avg place ${t.avg === null ? EMD : t.avg.toFixed(2)} ${MID} ${t.weeks} weeks</small></div>
      <div class="cnt"><span>${t.first}<small>1st</small></span><span>${t.second}<small>2nd</small></span><span>${t.third}<small>3rd</small></span><span>${t.fourth}<small>4th</small></span></div>
      <div class="dots" style="margin-top:8px">${dots}</div></div>`;
  }).join('') + '<p class="note">Where each player finished in the weekly standings, completed weeks only; dots run oldest to newest.</p>';
};

const tabClutch = () => {
  const C = D.clutch;
  if (!C || !C.weeks.some((w) => w.showdown)) return '<div class="empty">No final-day showdowns yet.</div>';
  const order = sortedBy((a, b) => C.players[b.id].won - C.players[a.id].won || C.players[b.id].comebacks - C.players[a.id].comebacks);
  const cards = order.map((p) => {
    const t = C.players[p.id];
    return `<div class="rc" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="rh">${av(p, 32)}<b>${esc(p.first)}</b></div>
      <div class="kv"><div><b>${t.won} / ${t.showdowns}</b><small>won showdowns</small></div><div><b>${t.comebacks}</b><small>comebacks</small></div>
      <div><b style="${t.blown ? 'color:var(--bad)' : ''}">${t.blown}</b><small>blown leads</small></div><div><b>${t.sundayAvg === null ? EMD : t.sundayAvg.toFixed(1)}</b><small>Sunday avg</small></div></div></div>`;
  }).join('');
  const nm = (ids) => ids.map((id) => esc(BY[id].first)).join(' &amp; ');
  const swings = C.weeks.filter((w) => w.swing).reverse().map((w) => {
    const pts = P.slice().sort((a, b) => (w.sunday[b.id] || 0) - (w.sunday[a.id] || 0)).map((p) => `${esc(p.first)} ${w.sunday[p.id] || 0}`).join(', ');
    return `<div class="swing"><b>Wk ${w.n}</b> ${MID} ${esc(w.label)}: ${nm(w.leadersBefore)} ${w.lead === 0 ? 'shared the lead' : 'led by ' + w.lead} entering Sunday; ${nm(w.winners)} took the week. Sunday: ${pts}</div>`;
  }).join('');
  return `<div class="rcards">${cards}</div><div class="eyebrow" style="margin:16px 4px 2px">Weeks the final day changed the lead</div>${swings || '<div class="swing">None yet.</div>'}
    <p class="note">A showdown is a completed week where two or more players entered Sunday within ${C.range} points of the lead, the most one day can swing. Comeback = won after trailing. Blown lead = led or shared the lead entering Sunday but did not win. Small samples: one showdown per week.</p>`;
};

const tabRec = () => {
  const R = D.records;
  if (!R || !R[P[0].id]) return '<div class="empty">No records yet.</div>';
  const st = (s) => `${s.best}${s.current > 0 ? ` <span class="chip good" style="padding:0 6px">now ${s.current}</span>` : ''}`;
  return '<div class="rcards">' + P.map((p) => {
    const r = R[p.id];
    return `<div class="rc" data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="rh">${av(p, 32)}<b>${esc(p.first)}</b></div>
      <div class="kv"><div><b>${r.bestDay.points}</b><small>best day (${md(r.bestDay.date)})</small></div><div><b>${r.perfectDays}</b><small>perfect days</small></div>
      <div><b>${st(r.dailyWinStreak)}</b><small>day-win streak</small></div><div><b>${st(r.gameWinStreak)}</b><small>game-win streak</small></div></div></div>`;
  }).join('') + '</div><p class="note">Perfect day = won every game of a fully recorded day. Streaks end on any non-win or DNP.</p>';
};

const tabSkips = () => {
  const rows = (D.missed || []).slice().sort((a, b) => b.missed - a.missed || BY[a.id].slot - BY[b.id].slot);
  if (!rows.length) return '<div class="empty">No games recorded yet.</div>';
  const max = Math.max(1, ...rows.map((r) => r.missed)), top = rows[0].missed;
  return '<div class="bars">' + rows.map((m) => {
    const p = BY[m.id];
    const chips = (m.missed > 0 && m.missed === top ? '<span class="chip">most skips</span>' : '') + (m.streak >= 2 ? `<span class="chip cold">${I.snow}${m.streak} in a row</span>` : '');
    const by = m.byGame.length ? `<div class="sub-l">${m.byGame.slice().sort((a, b) => b.missed - a.missed).map((g) => esc(g.name) + (g.missed > 1 ? ' ×' + g.missed : '')).join(' ' + MID + ' ')}${m.last ? ' ' + MID + ' last ' + md(m.last) : ''}</div>` : '';
    return `<div data-p="${p.id}" data-fb="${p.id}" style="${pv(p)}"><div class="frow">${av(p, 32)}<div class="who">${esc(p.first)}<div class="chips">${chips}</div></div><div class="bar"><i style="--w:${Math.round(100 * m.missed / max)}%"></i></div><div class="n">${m.missed}</div></div>${by}</div>`;
  }).join('') + `</div><p class="note">Games skipped while someone else played, all-time (${rows[0].held} games held).</p>`;
};

const PANES = { form: tabForm, h2h: tabH2H, games: tabGames, days: tabDays, fin: tabFin, weekly: tabWeekly, clutch: tabClutch, rec: tabRec, skips: tabSkips };
function showTab(id) {
  TAB = id;
  $$('#seg button').forEach((b) => b.classList.toggle('on', b.getAttribute('data-t') === id));
  const pane = $('#pane');
  pane.className = 'pane' + (id === 'games' ? ' gstats' : '');
  pane.innerHTML = PANES[id]();
  $$('[data-fin]', pane).forEach((b) => b.addEventListener('click', () => { const v = b.getAttribute('data-fin'); FINSEL = v === 'all' ? 'all' : +v; showTab('fin'); }));
  runCounts(pane); applyFocus();
}
function renderStats() {
  $('#stats').innerHTML = `${sectionHead('Stats', 'all-time unless noted')}<div class="card rv"><div class="seg" id="seg" role="tablist">${TABS.map((t) => `<button type="button" role="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="pane"></div></div>`;
  $$('#seg button').forEach((b) => b.addEventListener('click', () => showTab(b.getAttribute('data-t'))));
  showTab(TAB); watch($('#stats'));
}

/* ---- history ---- */
function renderHistory() {
  const weeks = (D.weeks || []).slice().reverse();
  const wRows = weeks.map((w, i) => `<tr><td>Wk ${weeks.length - i} ${MID} ${esc(w.label)}${w.complete ? '' : ' (live)'}${(w.missed || []).length ? ` ⚠${w.missed.length}` : ''}</td>` +
    P.map((p) => `<td class="${w.complete && w.winners.indexOf(p.id) >= 0 ? 'w' : ''}" style="${pv(p)}">${w.totals[p.id] || 0}</td>`).join('') + '</tr>').join('');
  const missed = {}; (D.missedDays || []).forEach((d) => { missed[d] = true; });
  let days = Object.keys(D.dayTotals).concat(D.missedDays || []);
  days = days.filter((d, i) => days.indexOf(d) === i).sort().reverse();
  const dRows = days.map((d) => {
    if (missed[d]) return `<tr class="miss"><td>${md(d)}</td><td colspan="${P.length}" style="text-align:left">no data ${EMD} day missed</td></tr>`;
    const t = D.dayTotals[d], best = Math.max.apply(null, P.map((p) => t[p.id] || 0));
    return `<tr><td>${longDate(d)}</td>` + P.map((p) => `<td class="${(t[p.id] || 0) === best && best > 0 ? 'w' : ''}" style="${pv(p)}">${t[p.id] || 0}</td>`).join('') + '</tr>';
  }).join('');
  const head = '<tr><th>' + EMD + '</th>' + P.map((p) => `<th>${esc(p.first)}</th>`).join('') + '</tr>';
  $('#history').innerHTML = `${sectionHead('History', 'every week and day')}
    <details class="fold rv"><summary>Weekly history</summary><div class="tbw"><table class="tbl">${head}${wRows}</table></div></details>
    <details class="fold rv"><summary>Daily history</summary><div class="tbw"><table class="tbl">${head}${dRows}</table></div></details>`;
  watch($('#history'));
}

/* ---------- chrome: theme toggle, scrollspy ----------------------------------- */
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { const t = localStorage.getItem('pl-theme'); if (THEMES.indexOf(t) >= 0) theme = t; } catch (e) { /* storage blocked: stay on auto */ }
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
  $('#themebtn').innerHTML = I[theme === 'light' ? 'sun' : theme === 'dark' ? 'moon' : 'auto'];
  $('#themebtn').setAttribute('title', 'Theme: ' + theme);
}
$('#themebtn').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem('pl-theme', theme); } catch (e) { /* ignore */ }
  applyTheme();
});
function spy() {
  const links = {}; $$('#nav a').forEach((a) => { links[a.getAttribute('data-sec')] = a; });
  if (!('IntersectionObserver' in window)) return;
  const o = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    Object.keys(links).forEach((k) => links[k].classList.toggle('on', k === e.target.id));
    const a = links[e.target.id]; if (a && a.scrollIntoView) { const nav = $('#nav'); nav.scrollTo({ left: a.offsetLeft - 16, behavior: REDUCE ? 'auto' : 'smooth' }); }
  }), { rootMargin: '-30% 0px -60% 0px' });
  Object.keys(links).forEach((k) => { const s = document.getElementById(k); if (s) o.observe(s); });
}

/* ---------- go ------------------------------------------------------------------ */
applyTheme();
renderHeader(); renderAlert(); renderRace(); renderToday(); renderOdds(); renderChartSection();
renderFame(); renderStats(); renderHistory();
applyFocus(); spy();
})();

</script>
